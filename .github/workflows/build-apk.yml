name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      source_type:
        description: 'url / html / zip / code'
        required: true
        type: string
      website_url:
        required: false
        type: string
        default: 'https://example.com'
      source_url:
        required: false
        type: string
        default: ''
      source_ext:
        description: 'html / js / ts / tsx / zip ...'
        required: false
        type: string
        default: ''
      icon_url:
        required: false
        type: string
        default: ''
      permissions:
        required: false
        type: string
        default: ''
      server_url:
        required: false
        type: string
        default: ''
      enable_notifications:
        required: false
        type: string
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # نزّل المصدر من LinkDrop
      - name: Download source
        if: ${{ inputs.source_url != '' }}
        run: |
          echo "⬇️ تحميل ${{ inputs.source_url }}"
          curl -L --fail -o "source-input.${{ inputs.source_ext }}" "${{ inputs.source_url }}"
          ls -lh source-input.${{ inputs.source_ext }}

      # نزّل الأيقونة
      - name: Download icon
        if: ${{ inputs.icon_url != '' }}
        run: |
          curl -L --fail -o icon-input.png "${{ inputs.icon_url }}"
          ls -lh icon-input.png

      # لو الملف JS/TS/JSX/TSX — نغلّفه في HTML مؤقت
      - name: Wrap code file in HTML
        if: ${{ inputs.source_type == 'code' && inputs.source_ext != 'html' && inputs.source_ext != 'htm' }}
        run: |
          EXT="${{ inputs.source_ext }}"
          case "$EXT" in
            js|mjs|cjs) TAG="module" ;;
            css) TAG="css" ;;
            *) TAG="module" ;;
          esac

          if [ "$TAG" = "css" ]; then
            cat > source-input.html <<HTML
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>${{ inputs.app_name }}</title>
          <link rel="stylesheet" href="source-input.$EXT"></head>
          <body><div id="app"></div></body></html>
          HTML
            cp "source-input.$EXT" "app.css"
          else
            cat > source-input.html <<HTML
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>${{ inputs.app_name }}</title></head>
          <body><div id="app"></div>
          <script type="$TAG" src="source-input.$EXT"></script>
          </body></html>
          HTML
          fi

      - name: Prepare project
        run: |
          chmod +x ./scripts/*.sh || true
          bash ./scripts/prepare.sh

      - name: Build APK
        run: |
          cd android-app
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
