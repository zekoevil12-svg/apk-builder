          package __PKG__;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;
          import com.chaquo.python.Python;
          import com.chaquo.python.android.AndroidPlatform;

          public class PythonService extends Service {
              private static final String CHANNEL_ID = "py_service";
              private PowerManager.WakeLock wakeLock;
              private volatile boolean busy = false;

              @Override public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Python IDE", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  Intent open = new Intent(this, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification notif = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("Python IDE is running")
                          .setContentText("Your script is running in the background")
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                  } else {
                      startForeground(1, notif);
                  }

                  if (!busy) {
                      busy = true;
                      try {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "pyide:run");
                          wakeLock.acquire(6 * 60 * 60 * 1000L);
                      } catch (Exception ignored) {}
                      new Thread(() -> {
                          try {
                              if (!Python.isStarted()) Python.start(new AndroidPlatform(this));
                              Python.getInstance().getModule("runner").callAttr("run_server", "");
                          } catch (Throwable ignored) {
                          } finally {
                              busy = false;
                              try { if (wakeLock != null && wakeLock.isHeld()) wakeLock.release(); } catch (Exception ignored) {}
                              stopForeground(true);
                              stopSelf();
                          }
                      }, "py-runner").start();
                  }
                  return START_NOT_STICKY;
              }

              @Override public void onDestroy() {
                  try { if (wakeLock != null && wakeLock.isHeld()) wakeLock.release(); } catch (Exception ignored) {}
                  super.onDestroy();
              }

              @Override public IBinder onBind(Intent intent) { return null; }
          }
