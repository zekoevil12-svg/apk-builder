name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      html_source_url:
        description: 'رابط ملف python-studio.html (مثلاً من GitHub Raw)'
        required: true
        type: string
      icon_url:
        required: false
        type: string
        default: ''
      onesignal_app_id:
        description: 'OneSignal App ID (اختياري)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          rm cmdline.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Download HTML & Icon
        run: |
          mkdir -p /tmp/src
          curl -L --fail -o /tmp/src/index.html "${{ inputs.html_source_url }}"
          if [ -n "${{ inputs.icon_url }}" ]; then
            curl -L --fail -o /tmp/icon.png "${{ inputs.icon_url }}" || true
          fi

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PKG_NAME: ${{ inputs.package_name }}
          OS_APP_ID: ${{ inputs.onesignal_app_id }}
        run: |
          set -e
          PROJECT=/tmp/app
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')

          mkdir -p "$PROJECT/app/src/main/java/$PKG_PATH"
          mkdir -p "$PROJECT/app/src/main/res/values"
          mkdir -p "$PROJECT/app/src/main/res/xml"
          mkdir -p "$PROJECT/app/src/main/res/mipmap-hdpi"
          mkdir -p "$PROJECT/app/src/main/assets"
          mkdir -p "$PROJECT/app/src/main/python"

          printf 'rootProject.name = "PythonStudio"\ninclude ":app"\n' > "$PROJECT/settings.gradle"

          cat > "$PROJECT/build.gradle" << 'EOF'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > "$PROJECT/app/build.gradle" << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PKG_NAME'
              compileSdk 34
              defaultConfig { applicationId "$PKG_NAME"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'com.onesignal:OneSignal:[4.7.4, 4.99.99]'
          }
          EOF

          printf 'android.useAndroidX=true\nandroid.enableJetifier=false\norg.gradle.jvmargs=-Xmx2048m\n' > "$PROJECT/gradle.properties"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT/local.properties"

          cat > "$PROJECT/app/src/main/res/xml/file_paths.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external" path="." />
              <files-path name="files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          EOF

          sort -u > /tmp/perms.txt << 'EOF'
          android.permission.INTERNET
          android.permission.ACCESS_NETWORK_STATE
          android.permission.READ_EXTERNAL_STORAGE
          android.permission.WRITE_EXTERNAL_STORAGE
          android.permission.READ_MEDIA_IMAGES
          android.permission.POST_NOTIFICATIONS
          EOF
          sed 's/^/    <uses-permission android:name="/; s/$/"\/>/' /tmp/perms.txt > /tmp/perms.xml

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          $(cat /tmp/perms.xml)
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="$APP_NAME"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="$PKG_NAME.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cp /tmp/src/index.html "$PROJECT/app/src/main/assets/index.html"
          if [ -f /tmp/icon.png ]; then cp /tmp/icon.png "$PROJECT/app/src/main/res/mipmap-hdpi/ic_launcher.png"; else
            printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==' | base64 -d > "$PROJECT/app/src/main/res/mipmap-hdpi/ic_launcher.png"
          fi

          cat > "$PROJECT/app/src/main/java/$PKG_PATH/MainActivity.java" << 'JAVAEOF'
          package __PKG__;

          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          import com.onesignal.OneSignal;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> mFilePathCallback;
              private static final int FILE_CHOOSER_RESULT_CODE = 1;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  String osAppId = "__OS_APP_ID__";
                  if (!osAppId.isEmpty() && !osAppId.equals("__OS_APP_ID__")) {
                      OneSignal.setAppId(osAppId);
                      OneSignal.promptForPushNotifications();
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  // تفعيل رفع الملفات لـ WebView (ضروري لـ Pyodide)
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (mFilePathCallback != null) mFilePathCallback.onReceiveValue(null);
                          mFilePathCallback = filePathCallback;
                          
                          Intent intent = fileChooserParams.createIntent();
                          // تفعيل اختيار مجلدات (لو النظام يدعم)
                          if (fileChooserParams.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) {
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          }
                          
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_RESULT_CODE);
                          } catch (ActivityNotFoundException e) {
                              mFilePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false; // تحميل عادي داخل التطبيق
                      }
                  });

                  // دعم تحميل الملفات (ZIP) من داخل Pyodide
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      try {
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          if (mimeType != null && !mimeType.isEmpty()) request.setMimeType(mimeType);
                          String cookies = CookieManager.getInstance().getCookie(url);
                          if (cookies != null) request.addRequestHeader("cookie", cookies);
                          if (userAgent != null) request.addRequestHeader("User-Agent", userAgent);
                          
                          String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                          request.setDescription("جاري التحميل...");
                          request.setTitle(fileName);
                          request.allowScanningByMediaScanner();
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                          
                          DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                          if (dm != null) {
                              dm.enqueue(request);
                              Toast.makeText(getApplicationContext(), "📥 جاري التحميل: " + fileName, Toast.LENGTH_LONG).show();
                          }
                      } catch (Exception e) {
                          Toast.makeText(getApplicationContext(), "❌ فشل التحميل: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (mFilePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) {
                              results = new Uri[]{Uri.parse(dataString)};
                          } else if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          }
                      }
                      mFilePathCallback.onReceiveValue(results);
                      mFilePathCallback = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          JAVAEOF

          sed -i "s/__PKG__/$PKG_NAME/g" "$PROJECT/app/src/main/java/$PKG_PATH/MainActivity.java"
          sed -i "s/__OS_APP_ID__/$OS_APP_ID/g" "$PROJECT/app/src/main/java/$PKG_PATH/MainActivity.java"

          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:statusBarColor">#0b0e14</item>\n        <item name="android:navigationBarColor">#0b0e14</item>\n    </style>\n</resources>\n' > "$PROJECT/app/src/main/res/values/styles.xml"

          echo "✅ Project Created Successfully"

      - name: Build APK
        run: |
          cd /tmp/app
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=========================================="
            echo "❌ Build Failed!"
            echo "=========================================="
            grep -B 2 -A 20 -i "What went wrong" build.log || true
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /tmp/app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
