          package __PKG__;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Process;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.OnBackPressedCallback;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.content.FileProvider;
          import com.chaquo.python.PyObject;
          import com.chaquo.python.Python;
          import com.chaquo.python.android.AndroidPlatform;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.RandomAccessFile;
          import java.nio.charset.StandardCharsets;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipOutputStream;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private PyObject runner;
              private ValueCallback<Uri[]> fileCallback;
              private ActivityResultLauncher<Intent> chooser;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (!Python.isStarted()) Python.start(new AndroidPlatform(this));
                  runner = Python.getInstance().getModule("runner");

                  File base = getFilesDir();
                  runner.callAttr("init_env",
                          new File(base, "workspace").getAbsolutePath(),
                          new File(base, "server.log").getAbsolutePath());

                  getWindow().setStatusBarColor(0xFF161b22);
                  getWindow().setNavigationBarColor(0xFF0d1117);

                  chooser = registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), res -> {
                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res.getResultCode(), res.getData()));
                          fileCallback = null;
                      }
                  });

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF0d1117);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowFileAccessFromFileURLs(false);
                  s.setAllowUniversalAccessFromFileURLs(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("file:///android_asset/")) return false;
                          openExternalUrl(u);
                          return true;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              chooser.launch(Intent.createChooser(i, "Select files"));
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new PythonBridge(), "Android");
                  webView.loadUrl("file:///android_asset/index.html");

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override public void handleOnBackPressed() {
                          webView.evaluateJavascript("window.onBack ? window.onBack() : false", v -> {
                              if (!"true".equals(v)) moveTaskToBack(true);
                          });
                      }
                  });

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
              }

              private void openExternalUrl(String url) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception ignored) {}
              }

              private static String b64(String s) {
                  return Base64.encodeToString(s.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
              }

              private void reply(String id, String payload, boolean ok) {
                  final String js = "window.onPyResult('" + id + "','" + b64(payload) + "'," + ok + ")";
                  webView.post(() -> webView.evaluateJavascript(js, null));
              }

              private void zipDir(File root, File dir, ZipOutputStream z) throws IOException {
                  File[] kids = dir.listFiles();
                  if (kids == null) return;
                  for (File k : kids) {
                      if (k.isDirectory()) {
                          if (k.getName().equals("__pycache__")) continue;
                          zipDir(root, k, z);
                      } else {
                          String rel = root.toURI().relativize(k.toURI()).getPath();
                          z.putNextEntry(new ZipEntry(rel));
                          try (FileInputStream in = new FileInputStream(k)) {
                              byte[] buf = new byte[8192];
                              int n;
                              while ((n = in.read(buf)) > 0) z.write(buf, 0, n);
                          }
                          z.closeEntry();
                      }
                  }
              }

              private void shareFile(File f, String mime) {
                  runOnUiThread(() -> {
                      try {
                          Uri u = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                          Intent i = new Intent(Intent.ACTION_SEND);
                          i.setType(mime);
                          i.putExtra(Intent.EXTRA_STREAM, u);
                          i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          startActivity(Intent.createChooser(i, "Share"));
                      } catch (Exception ignored) {}
                  });
              }

              public class PythonBridge {
                  @JavascriptInterface public void callPy(String func, String args, String reqId) {
                      new Thread(() -> {
                          try {
                              PyObject res = runner.callAttr(func, args);
                              reply(reqId, res == null ? "" : res.toString(), true);
                          } catch (Throwable e) {
                              reply(reqId, String.valueOf(e.getMessage()), false);
                          }
                      }).start();
                  }

                  @JavascriptInterface public void callPyBinary(String func, String data, String name, String reqId) {
                      new Thread(() -> {
                          try {
                              PyObject res = runner.callAttr(func, data, name);
                              reply(reqId, res == null ? "" : res.toString(), true);
                          } catch (Throwable e) {
                              reply(reqId, String.valueOf(e.getMessage()), false);
                          }
                      }).start();
                  }

                  @JavascriptInterface public void startServer() {
                      Intent i = new Intent(MainActivity.this, PythonService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i); else startService(i);
                  }

                  /** يرجع "offset:base64" - الجديد فقط من السجل */
                  @JavascriptInterface public String readLog(String offset) {
                      try {
                          File f = new File(getFilesDir(), "server.log");
                          if (!f.exists()) return "0:";
                          long len = f.length();
                          long off = Long.parseLong(offset);
                          if (off > len || off < 0) off = 0;
                          if (len - off > 200000) off = len - 200000;
                          if (len == off) return len + ":";
                          try (RandomAccessFile r = new RandomAccessFile(f, "r")) {
                              r.seek(off);
                              byte[] buf = new byte[(int) (len - off)];
                              r.readFully(buf);
                              return len + ":" + Base64.encodeToString(buf, Base64.NO_WRAP);
                          }
                      } catch (Exception e) {
                          return "0:";
                      }
                  }

                  @JavascriptInterface public void clearLogs() {
                      try { new FileOutputStream(new File(getFilesDir(), "server.log")).close(); } catch (Exception ignored) {}
                  }

                  @JavascriptInterface public void copyText(String text) {
                      runOnUiThread(() -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("PyIDE", text));
                      });
                  }

                  @JavascriptInterface public void openExternal(String url) { openExternalUrl(url); }

                  @JavascriptInterface public void shareWorkspace() {
                      new Thread(() -> {
                          try {
                              File ws = new File(getFilesDir(), "workspace");
                              File out = new File(getCacheDir(), "workspace.zip");
                              try (ZipOutputStream z = new ZipOutputStream(new FileOutputStream(out))) {
                                  zipDir(ws, ws, z);
                              }
                              shareFile(out, "application/zip");
                          } catch (Exception ignored) {}
                      }).start();
                  }

                  @JavascriptInterface public void shareWorkspaceFile(String rel) {
                      new Thread(() -> {
                          try {
                              File ws = new File(getFilesDir(), "workspace").getCanonicalFile();
                              File src = new File(ws, rel).getCanonicalFile();
                              if (!src.getPath().startsWith(ws.getPath() + File.separator) || !src.isFile()) return;
                              File dir = new File(getCacheDir(), "share");
                              dir.mkdirs();
                              File dst = new File(dir, src.getName());
                              try (FileInputStream in = new FileInputStream(src); FileOutputStream out = new FileOutputStream(dst)) {
                                  byte[] buf = new byte[8192];
                                  int n;
                                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                              }
                              shareFile(dst, src.getName().endsWith(".py") ? "text/plain" : "*/*");
                          } catch (Exception ignored) {}
                      }).start();
                  }

                  /** إيقاف قسري للمحرك (للسكربتات العالقة) */
                  @JavascriptInterface public void restartApp() {
                      try {
                          Intent i = getPackageManager().getLaunchIntentForPackage(getPackageName());
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                              PendingIntent pi = PendingIntent.getActivity(MainActivity.this, 7, i,
                                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_CANCEL_CURRENT);
                              ((AlarmManager) getSystemService(ALARM_SERVICE)).set(AlarmManager.RTC,
                                      System.currentTimeMillis() + 400, pi);
                          }
                      } catch (Exception ignored) {}
                      stopService(new Intent(MainActivity.this, PythonService.class));
                      Process.killProcess(Process.myPid());
                  }
              }
          }
