name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      source_type:
        required: true
        type: string
      website_url:
        required: false
        type: string
        default: 'https://example.com'
      source_url:
        required: false
        type: string
        default: ''
      source_ext:
        required: false
        type: string
        default: ''
      icon_url:
        required: false
        type: string
        default: ''
      permissions:
        required: false
        type: string
        default: ''
      server_url:
        required: false
        type: string
        default: ''
      enable_notifications:
        required: false
        type: string
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Setup Android SDK
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          rm cmdline.zip

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "✅ Android SDK جاهز"

      - name: Download source
        if: ${{ inputs.source_url != '' }}
        run: |
          mkdir -p /tmp/src
          curl -L --fail -o "/tmp/src/source.${{ inputs.source_ext }}" "${{ inputs.source_url }}"
          ls -lh /tmp/src/

      - name: Download icon
        if: ${{ inputs.icon_url != '' }}
        run: |
          curl -L --fail -o /tmp/icon.png "${{ inputs.icon_url }}" || true
          ls -lh /tmp/icon.png || true

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PKG_NAME: ${{ inputs.package_name }}
          SRC_TYPE: ${{ inputs.source_type }}
          SRC_EXT: ${{ inputs.source_ext }}
          WEBSITE: ${{ inputs.website_url }}
          PERMS: ${{ inputs.permissions }}
        run: |
          set -e
          PROJECT=/tmp/app

          # ✅ صلّح مسار الباكدج
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          echo "📦 PKG_PATH=$PKG_PATH"

          mkdir -p "$PROJECT/app/src/main/java/$PKG_PATH"
          mkdir -p $PROJECT/app/src/main/res/values
          mkdir -p $PROJECT/app/src/main/res/mipmap-hdpi
          mkdir -p $PROJECT/app/src/main/assets

          # ---- settings.gradle ----
          cat > $PROJECT/settings.gradle <<'EOF'
rootProject.name = "MyApp"
include ':app'
EOF

          # ---- root build.gradle ----
          cat > $PROJECT/build.gradle <<'EOF'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOF

          # ---- app/build.gradle ----
          cat > $PROJECT/app/build.gradle <<EOF
plugins { id 'com.android.application' }
android {
    namespace '$PKG_NAME'
    compileSdk 34
    defaultConfig {
        applicationId "$PKG_NAME"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
EOF

          # ---- gradle.properties ----
          cat > $PROJECT/gradle.properties <<'EOF'
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
EOF

          # ---- local.properties ----
          echo "sdk.dir=$ANDROID_HOME" > $PROJECT/local.properties

          # ---- AndroidManifest.xml ----
          PERMS_XML=""
          if [ -n "$PERMS" ]; then
            IFS=',' read -ra PARRS <<< "$PERMS"
            for p in "${PARRS[@]}"; do
              case "$p" in
                camera)    PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.CAMERA\"/>"$'\n' ;;
                location)  PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>"$'\n'"    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>"$'\n' ;;
                mic)       PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>"$'\n' ;;
                storage)   PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>"$'\n'"    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>"$'\n' ;;
                notif)     PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>"$'\n' ;;
                vibrate)   PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.VIBRATE\"/>"$'\n' ;;
                contacts)  PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.READ_CONTACTS\"/>"$'\n' ;;
                phone)     PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.CALL_PHONE\"/>"$'\n' ;;
              esac
            done
          fi

          cat > $PROJECT/app/src/main/AndroidManifest.xml <<EOF
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
${PERMS_XML}    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="$APP_NAME"
        android:usesCleartextTraffic="true"
        android:theme="@style/Theme.AppCompat.Light.NoActionBar">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize|keyboardHidden">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

          # ---- MainActivity.java ----
          cat > "$PROJECT/app/src/main/java/$PKG_PATH/MainActivity.java" <<EOF
package $PKG_NAME;

import android.annotation.SuppressLint;
import android.os.Bundle;
import android.webkit.PermissionRequest;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private WebView webView;

    @SuppressLint("SetJavaScriptEnabled")
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        webView = new WebView(this);
        setContentView(webView);

        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setAllowFileAccess(true);
        s.setAllowContentAccess(true);
        s.setMediaPlaybackRequiresUserGesture(false);
        s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

        webView.setWebViewClient(new WebViewClient());
        webView.setWebChromeClient(new WebChromeClient() {
            @Override
            public void onPermissionRequest(final PermissionRequest request) {
                runOnUiThread(() -> request.grant(request.getResources()));
            }
        });

        if ("$SRC_TYPE".equals("url")) {
            webView.loadUrl("$WEBSITE");
        } else {
            webView.loadUrl("file:///android_asset/index.html");
        }
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }
}
EOF

          # ---- styles.xml ----
          cat > $PROJECT/app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"/>
</resources>
EOF

          # ---- استخراج المصدر في assets ----
          if [ -f "/tmp/src/source.$SRC_EXT" ]; then
            if [ "$SRC_EXT" = "zip" ]; then
              mkdir -p /tmp/extracted
              cd /tmp/extracted
              unzip -q "/tmp/src/source.zip"
              # لو فيه فولدر واحد جوه، انقل محتواه
              if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls -1)" ]; then
                INNER=$(ls -1)
                cp -r "$INNER"/* $PROJECT/app/src/main/assets/ 2>/dev/null || true
              else
                cp -r /tmp/extracted/* $PROJECT/app/src/main/assets/ 2>/dev/null || true
              fi
              echo "📦 محتوى assets:"
              ls -la $PROJECT/app/src/main/assets/ | head -20
            else
              # ملف مفرد
              cp "/tmp/src/source.$SRC_EXT" "$PROJECT/app/src/main/assets/index.$SRC_EXT"
              if [ "$SRC_EXT" != "html" ] && [ "$SRC_EXT" != "htm" ]; then
                cat > $PROJECT/app/src/main/assets/index.html <<EOF
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>$APP_NAME</title></head>
<body><div id="app"></div>
<script src="index.$SRC_EXT"></script>
</body>
</html>
EOF
              fi
            fi
          fi

          # ---- الأيقونة ----
          if [ -f "/tmp/icon.png" ] && [ -s "/tmp/icon.png" ]; then
            for dpi in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p $PROJECT/app/src/main/res/$dpi
              cp /tmp/icon.png $PROJECT/app/src/main/res/$dpi/ic_launcher.png
            done
          else
            # أيقونة افتراضية 1x1 PNG
            B64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
            echo "$B64" | base64 -d > $PROJECT/app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

          echo "✅ تم إنشاء المشروع بنجاح"
          echo "📂 الملفات:"
          find $PROJECT -type f | head -30

      - name: Build APK
        run: |
          cd /tmp/app
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tail -100
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /tmp/app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
