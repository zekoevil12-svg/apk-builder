name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      source_type:
        required: true
        type: string
      website_url:
        required: false
        type: string
        default: 'https://example.com'
      source_url:
        required: false
        type: string
        default: ''
      source_ext:
        required: false
        type: string
        default: ''
      icon_url:
        required: false
        type: string
        default: ''
      permissions:
        required: false
        type: string
        default: ''
      server_url:
        required: false
        type: string
        default: ''
      enable_notifications:
        required: false
        type: string
        default: 'no'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          rm cmdline.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "SDK Ready"

      - name: Download source
        if: ${{ inputs.source_url != '' }}
        run: |
          mkdir -p /tmp/src
          curl -L --fail -o "/tmp/src/source.${{ inputs.source_ext }}" "${{ inputs.source_url }}"
          ls -lh /tmp/src/

      - name: Download icon
        if: ${{ inputs.icon_url != '' }}
        run: |
          curl -L --fail -o /tmp/icon.png "${{ inputs.icon_url }}" || true
          ls -lh /tmp/icon.png || true

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PKG_NAME: ${{ inputs.package_name }}
          SRC_TYPE: ${{ inputs.source_type }}
          SRC_EXT: ${{ inputs.source_ext }}
          WEBSITE: ${{ inputs.website_url }}
          PERMS: ${{ inputs.permissions }}
        run: |
          set -e
          PROJECT=/tmp/app
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          echo "📦 PKG=$PKG_NAME PATH=$PKG_PATH"

          mkdir -p "$PROJECT/app/src/main/java/$PKG_PATH"
          mkdir -p "$PROJECT/app/src/main/res/values"
          mkdir -p "$PROJECT/app/src/main/res/mipmap-hdpi"
          mkdir -p "$PROJECT/app/src/main/assets"

          # settings.gradle
          printf 'rootProject.name = "MyApp"\ninclude ":app"\n' > "$PROJECT/settings.gradle"

          # root build.gradle
          cat > "$PROJECT/build.gradle" << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # app/build.gradle
          cat > "$PROJECT/app/build.gradle" << EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PKG_NAME'
              compileSdk 34
              defaultConfig {
                  applicationId "$PKG_NAME"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # gradle.properties
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m\n' > "$PROJECT/gradle.properties"

          # local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT/local.properties"

          # Build permissions XML
          PERMS_XML=""
          if [ -n "$PERMS" ]; then
            IFS=',' read -ra PARRS <<< "$PERMS"
            for p in "${PARRS[@]}"; do
              p=$(echo "$p" | tr -d ' ')
              case "$p" in
                camera)    PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.CAMERA\"/>"$'\n' ;;
                location)  PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>"$'\n' ;;
                mic)       PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>"$'\n' ;;
                storage)   PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>"$'\n' ;;
                notif)     PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>"$'\n' ;;
                vibrate)   PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.VIBRATE\"/>"$'\n' ;;
                contacts)  PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.READ_CONTACTS\"/>"$'\n' ;;
                phone)     PERMS_XML="${PERMS_XML}    <uses-permission android:name=\"android.permission.CALL_PHONE\"/>"$'\n' ;;
              esac
            done
          fi

          # Manifest
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
            echo '    <uses-permission android:name="android.permission.INTERNET"/>'
            echo '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>'
            if [ -n "$PERMS_XML" ]; then
              printf '%s' "$PERMS_XML"
            fi
            echo '    <application'
            echo '        android:allowBackup="true"'
            echo '        android:icon="@mipmap/ic_launcher"'
            echo "        android:label=\"$APP_NAME\""
            echo '        android:usesCleartextTraffic="true"'
            echo '        android:theme="@style/AppTheme">'
            echo '        <activity'
            echo '            android:name=".MainActivity"'
            echo '            android:exported="true"'
            echo '            android:configChanges="orientation|screenSize|keyboardHidden">'
            echo '            <intent-filter>'
            echo '                <action android:name="android.intent.action.MAIN"/>'
            echo '                <category android:name="android.intent.category.LAUNCHER"/>'
            echo '            </intent-filter>'
            echo '        </activity>'
            echo '    </application>'
            echo '</manifest>'
          } > "$PROJECT/app/src/main/AndroidManifest.xml"

          # MainActivity.java
          {
            echo "package $PKG_NAME;"
            echo ''
            echo 'import android.annotation.SuppressLint;'
            echo 'import android.app.DownloadManager;'
            echo 'import android.content.Context;'
            echo 'import android.net.Uri;'
            echo 'import android.os.Bundle;'
            echo 'import android.os.Environment;'
            echo 'import android.webkit.CookieManager;'
            echo 'import android.webkit.DownloadListener;'
            echo 'import android.webkit.PermissionRequest;'
            echo 'import android.webkit.URLUtil;'
            echo 'import android.webkit.WebChromeClient;'
            echo 'import android.webkit.WebSettings;'
            echo 'import android.webkit.WebView;'
            echo 'import android.webkit.WebViewClient;'
            echo 'import android.widget.Toast;'
            echo 'import androidx.appcompat.app.AppCompatActivity;'
            echo ''
            echo 'public class MainActivity extends AppCompatActivity {'
            echo '    private WebView webView;'
            echo ''
            echo '    @SuppressLint("SetJavaScriptEnabled")'
            echo '    @Override'
            echo '    protected void onCreate(Bundle savedInstanceState) {'
            echo '        super.onCreate(savedInstanceState);'
            echo '        webView = new WebView(this);'
            echo '        setContentView(webView);'
            echo ''
            echo '        WebSettings s = webView.getSettings();'
            echo '        s.setJavaScriptEnabled(true);'
            echo '        s.setDomStorageEnabled(true);'
            echo '        s.setAllowFileAccess(true);'
            echo '        s.setAllowContentAccess(true);'
            echo '        s.setMediaPlaybackRequiresUserGesture(false);'
            echo '        s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);'
            echo ''
            echo '        CookieManager.getInstance().setAcceptCookie(true);'
            echo '        CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);'
            echo ''
            echo '        webView.setWebViewClient(new WebViewClient());'
            echo '        webView.setWebChromeClient(new WebChromeClient() {'
            echo '            @Override'
            echo '            public void onPermissionRequest(final PermissionRequest request) {'
            echo '                runOnUiThread(new Runnable() {'
            echo '                    @Override'
            echo '                    public void run() {'
            echo '                        request.grant(request.getResources());'
            echo '                    }'
            echo '                });'
            echo '            }'
            echo '        });'
            echo ''
            echo '        webView.setDownloadListener(new DownloadListener() {'
            echo '            @Override'
            echo '            public void onDownloadStart(String url, String userAgent,'
            echo '                                        String contentDisposition, String mimeType,'
            echo '                                        long contentLength) {'
            echo '                try {'
            echo '                    DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));'
            echo '                    request.setMimeType(mimeType);'
            echo '                    String cookies = CookieManager.getInstance().getCookie(url);'
            echo '                    request.addRequestHeader("cookie", cookies);'
            echo '                    request.addRequestHeader("User-Agent", userAgent);'
            echo '                    request.setDescription("Downloading");'
            echo '                    String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);'
            echo '                    request.setTitle(fileName);'
            echo '                    request.allowScanningByMediaScanner();'
            echo '                    request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);'
            echo '                    request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);'
            echo '                    DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);'
            echo '                    if (dm != null) {'
            echo '                        dm.enqueue(request);'
            echo '                        Toast.makeText(getApplicationContext(), "Downloading: " + fileName, Toast.LENGTH_LONG).show();'
            echo '                    }'
            echo '                } catch (Exception e) {'
            echo '                    Toast.makeText(getApplicationContext(), "Download failed: " + e.getMessage(), Toast.LENGTH_LONG).show();'
            echo '                }'
            echo '            }'
            echo '        });'
            echo ''
            echo "        if (\"$SRC_TYPE\".equals(\"url\")) {"
            echo "            webView.loadUrl(\"$WEBSITE\");"
            echo '        } else {'
            echo '            webView.loadUrl("file:///android_asset/index.html");'
            echo '        }'
            echo '    }'
            echo ''
            echo '    @Override'
            echo '    public void onBackPressed() {'
            echo '        if (webView.canGoBack()) webView.goBack();'
            echo '        else super.onBackPressed();'
            echo '    }'
            echo '}'
          } > "$PROJECT/app/src/main/java/$PKG_PATH/MainActivity.java"

          # styles.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"/>\n</resources>\n' > "$PROJECT/app/src/main/res/values/styles.xml"

          # Icon
          if [ -f /tmp/icon.png ] && [ -s /tmp/icon.png ]; then
            cp /tmp/icon.png "$PROJECT/app/src/main/res/mipmap-hdpi/ic_launcher.png"
          else
            printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==' | base64 -d > "$PROJECT/app/src/main/res/mipmap-hdpi/ic_launcher.png"
          fi

          # Source files
          SRC_FILE="/tmp/src/source.$SRC_EXT"
          if [ -f "$SRC_FILE" ]; then
            if [ "$SRC_EXT" = "zip" ]; then
              mkdir -p /tmp/extracted
              unzip -q "$SRC_FILE" -d /tmp/extracted
              COUNT=$(ls -1 /tmp/extracted | wc -l)
              if [ "$COUNT" -eq 1 ] && [ -d "/tmp/extracted/$(ls -1 /tmp/extracted)" ]; then
                INNER=$(ls -1 /tmp/extracted)
                cp -r /tmp/extracted/"$INNER"/* "$PROJECT/app/src/main/assets/" 2>/dev/null || true
              else
                cp -r /tmp/extracted/* "$PROJECT/app/src/main/assets/" 2>/dev/null || true
              fi
            else
              cp "$SRC_FILE" "$PROJECT/app/src/main/assets/index.$SRC_EXT"
              if [ "$SRC_EXT" != "html" ] && [ "$SRC_EXT" != "htm" ]; then
                printf '<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>%s</title></head>\n<body><div id="app"></div>\n<script src="index.%s"></script>\n</body></html>\n' "$APP_NAME" "$SRC_EXT" > "$PROJECT/app/src/main/assets/index.html"
              fi
            fi
          fi

          echo ""
          echo "===== 📋 محتوى المشروع ====="
          find "$PROJECT" -type f | sort
          echo ""
          echo "===== 📄 AndroidManifest.xml ====="
          cat "$PROJECT/app/src/main/AndroidManifest.xml"

      - name: Build APK
        run: |
          cd /tmp/app
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        if: always()
        run: |
          echo "🔍 البحث عن APK..."
          find /tmp/app -name "*.apk" -type f 2>/dev/null || echo "مفيش APK"
          echo "📂 محتوى outputs:"
          ls -laR /tmp/app/app/build/outputs/ 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /tmp/app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
