            body.drawer-open #scrim{display:none}
            #btnDrawer{display:none}
          }
          </style>
          </head>
          <body class="s1">
          <div id="app">
            <header id="top">
              <button class="ib" id="btnDrawer" onclick="toggleDrawer()">☰</button>
              <div id="title"><span id="curName">PyIDE</span><i id="dirty" hidden>●</i></div>
              <button class="ib" onclick="saveCurrent(true)">💾</button>
              <button class="ib" onclick="toggleFind()">🔍</button>
              <button class="run" id="btnRun" onclick="toggleRun()">▶ Run</button>
              <button class="ib" onclick="openSettings()">⚙</button>
            </header>

            <div id="body">
              <aside id="drawer">
                <div class="dh">
                  <span data-i="files">Files</span>
                  <button class="ib" onclick="newNode(false)">📄</button>
                  <button class="ib" onclick="newNode(true)">📁</button>
                  <button class="ib" onclick="$('fileIn').click()">⬆</button>
                </div>
                <div id="tree"></div>
              </aside>
              <div id="scrim" onclick="toggleDrawer(false)"></div>

              <main id="main">
                <div id="tabs"></div>
                <div id="findbar" hidden>
                  <input id="fin" data-ph="find" placeholder="Find" oninput="findNext(false,true)">
                  <input id="rin" data-ph="replace" placeholder="Replace">
                  <button class="sb" onclick="findNext(true)">▲</button>
                  <button class="sb" onclick="findNext(false)">▼</button>
                  <button class="sb" onclick="replaceOne()" data-i="replace">Replace</button>
                  <button class="sb" onclick="replaceAll()" data-i="replaceAll">All</button>
                  <button class="sb" onclick="toggleFind(false)">✕</button>
                </div>
                <div id="editorHost">
                  <div id="empty"><span data-i="emptyHint">Open a file</span></div>
                  <textarea id="code"></textarea>
                </div>
                <div id="keys"></div>
                <section id="term">
                  <div id="thead">
                    <div class="t"><i id="dot"></i><span data-i="terminal">Terminal</span></div>
                    <button onclick="openPreview()">🌐 <span data-i="preview">Preview</span></button>
                    <button onclick="copyLog()">⧉</button>
                    <button onclick="clearTerm()" data-i="clear">Clear</button>
                    <button onclick="cycleTerm()" id="btnTerm">▲</button>
                  </div>
                  <div id="tbody">
                    <div id="tout"></div>
                    <div id="tin">
                      <input id="tinput" data-ph="typeHere" placeholder="..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
                      <button onclick="submitTerm()">➤</button>
                    </div>
                  </div>
                </section>
              </main>
            </div>
          </div>

          <div class="overlay" id="settings" hidden>
            <div class="oh"><button class="ib" onclick="$('settings').hidden=true">←</button><span data-i="settings">Settings</span></div>
            <div class="ob">
              <div class="sec"><h4 data-i="language">Language</h4>
                <div class="fr"><select id="selLang" onchange="S.lang=this.value;saveS();applyLang()"><option value="ar">العربية</option><option value="en">English</option></select>
                <select id="selTheme" onchange="S.theme=this.value;saveS();applyTheme()"><option value="dark" data-i="dark">Dark</option><option value="light" data-i="light">Light</option></select></div>
              </div>
              <div class="sec"><h4 data-i="fontSize">Font size</h4>
                <div class="fr"><input type="range" id="rngFs" min="10" max="24" step="1" style="flex:1" oninput="S.fs=+this.value;saveS();applyFont()"><b id="fsv"></b></div>
              </div>
              <div class="sec">
                <div class="fr"><label><input type="checkbox" id="chkWrap" onchange="S.wrap=this.checked;saveS();ed.setOption('lineWrapping',S.wrap)"> <span data-i="wrap">Wrap</span></label>
                <label><input type="checkbox" id="chkAuto" onchange="S.auto=this.checked;saveS()"> <span data-i="autosave">Autosave</span></label></div>
              </div>
              <div class="sec"><h4 data-i="mainFile">Main file</h4>
                <div class="fr"><input type="text" id="mainIn" value="main.py"><button class="btn pri" onclick="saveMain()" data-i="setMain">Set</button></div>
              </div>
              <div class="sec"><h4 data-i="pipTitle">Install package</h4>
                <div class="fr"><input type="text" id="pipIn" placeholder="e.g. colorama" autocapitalize="off" autocorrect="off"><button class="btn pri" onclick="pipInstall()" data-i="install">Install</button></div>
                <h4 style="margin-top:14px" data-i="libs">Installed</h4>
                <div class="chips" id="libs"></div>
                <h4 style="margin-top:14px" data-i="bundled">Bundled</h4>
                <div class="chips"><span class="chip">requests</span><span class="chip">numpy</span><span class="chip">pandas</span><span class="chip">beautifulsoup4</span><span class="chip">lxml</span><span class="chip">flask</span><span class="chip">telethon</span><span class="chip">pycryptodome</span><span class="chip">pillow</span><span class="chip">rich</span><span class="chip">colorama</span><span class="chip">tqdm</span></div>
              </div>
              <div class="sec fr" style="flex-direction:column;align-items:stretch">
                <button class="btn" onclick="Android.shareWorkspace()" data-i="shareWs">Share</button>
                <button class="btn dan" onclick="forceRestart()" data-i="restart">Restart</button>
              </div>
              <div class="sec"><h4 data-i="about">About</h4><div id="about" style="color:var(--mut);font-size:12px;font-family:monospace"></div></div>
            </div>
          </div>

          <div class="overlay" id="prev" hidden>
            <div class="oh"><button class="ib" onclick="closePreview()">←</button><span id="prevUrl"></span>
              <button class="ib" onclick="$('pframe').src=$('pframe').src">⟳</button>
              <button class="ib" onclick="Android.openExternal(curUrl)">↗</button></div>
            <iframe id="pframe"></iframe>
          </div>

          <div class="modal" id="modal"><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div><input id="mInput" hidden autocapitalize="off" autocorrect="off" spellcheck="false"><div id="mBtns"></div></div></div>
          <div id="toast"></div>
          <input type="file" id="fileIn" multiple hidden>

          <script src="lib/codemirror.min.js"></script>
          <script src="lib/python.min.js"></script>
          <script src="lib/javascript.min.js"></script>
          <script src="lib/xml.min.js"></script>
          <script src="lib/css.min.js"></script>
          <script src="lib/htmlmixed.min.js"></script>
          <script src="lib/markdown.min.js"></script>
          <script src="lib/shell.min.js"></script>
          <script src="lib/searchcursor.min.js"></script>
          <script src="lib/closebrackets.min.js"></script>
          <script src="lib/matchbrackets.min.js"></script>
          <script src="lib/active-line.min.js"></script>
          <script src="lib/comment.min.js"></script>
          <script>
          const $ = id => document.getElementById(id);
          const S = {theme:'dark', fs:14, wrap:true, auto:true, lang:'ar', open:[], last:null};
          try { Object.assign(S, JSON.parse(localStorage.getItem('pyide') || '{}')); } catch (e) {}
          function saveS() { try { localStorage.setItem('pyide', JSON.stringify(S)); } catch (e) {} }

          const L = {
            ar: {files:'الملفات', newFile:'ملف جديد', newFolder:'مجلد جديد', upload:'رفع', rename:'إعادة تسمية', del:'حذف', share:'مشاركة',
              cancel:'إلغاء', ok:'موافق', saved:'تم الحفظ ✓', settings:'الإعدادات', language:'اللغة والمظهر', dark:'داكن', light:'فاتح',
              fontSize:'حجم الخط', wrap:'التفاف الأسطر', autosave:'حفظ تلقائي', mainFile:'ملف التشغيل الرئيسي', setMain:'تعيين',
              pipTitle:'تثبيت مكتبة (Pip)', install:'تثبيت', libs:'المكتبات المثبتة', bundled:'مثبتة مسبقاً', shareWs:'مشاركة المشروع (zip)',
              restart:'إيقاف قسري وإعادة تشغيل المحرك', about:'حول', terminal:'الطرفية', clear:'مسح', preview:'معاينة', replace:'استبدال',
              replaceAll:'الكل', find:'بحث', nomatch:'لا توجد نتائج', binary:'ملف ثنائي لا يمكن فتحه', confirmDel:'حذف نهائي:',
              stopping:'جارٍ الإيقاف…', emptyHint:'افتح ملفاً من القائمة ☰', typeHere:'أوامر أو مدخلات البرنامج…', name:'الاسم',
              run:'تشغيل', stop:'إيقاف', unzip:'فك ضغط الملف؟', uploaded:'تم الرفع ✓', exists:'الاسم موجود مسبقاً', url:'عنوان المعاينة',
              restartConfirm:'سيتم إغلاق التطبيق. افتحه مرة أخرى بعد ذلك. متابعة؟', copied:'تم النسخ', newHere:'جديد هنا', none:'لا شيء'},
            en: {files:'Files', newFile:'New file', newFolder:'New folder', upload:'Upload', rename:'Rename', del:'Delete', share:'Share',
              cancel:'Cancel', ok:'OK', saved:'Saved ✓', settings:'Settings', language:'Language & theme', dark:'Dark', light:'Light',
              fontSize:'Font size', wrap:'Wrap lines', autosave:'Autosave', mainFile:'Main file', setMain:'Set',
              pipTitle:'Install package (Pip)', install:'Install', libs:'Installed packages', bundled:'Bundled', shareWs:'Share project (zip)',
              restart:'Force stop & restart engine', about:'About', terminal:'Terminal', clear:'Clear', preview:'Preview', replace:'Replace',
              replaceAll:'All', find:'Find', nomatch:'No matches', binary:'Binary file cannot be opened', confirmDel:'Delete permanently:',
              stopping:'Stopping…', emptyHint:'Open a file from ☰', typeHere:'Commands or program input…', name:'Name',
              run:'Run', stop:'Stop', unzip:'Unzip this file?', uploaded:'Uploaded ✓', exists:'Name already exists', url:'Preview URL',
              restartConfirm:'The app will close. Open it again afterwards. Continue?', copied:'Copied', newHere:'New here', none:'none'}
          };
          const t = k => (L[S.lang] || L.en)[k] || k;
          function applyLang() {
            document.querySelectorAll('[data-i]').forEach(e => { e.textContent = t(e.dataset.i); });
            document.querySelectorAll('[data-ph]').forEach(e => { e.placeholder = t(e.dataset.ph); });
            setRunUi(running);
          }
          function applyTheme() {
            document.documentElement.dataset.theme = S.theme;
            if (ed) ed.setOption('theme', S.theme === 'dark' ? 'material-darker' : 'default');
          }
          function applyFont() {
            document.documentElement.style.setProperty('--fs', S.fs + 'px');
            $('fsv').textContent = S.fs;
            if (ed) ed.refresh();
          }

          /* ---------- جسر بايثون ---------- */
          const pending = {};
          let rid = 0;
          function dec(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
          }
          window.onPyResult = function (id, b64, ok) {
            const p = pending[id];
            if (!p) return;
            delete pending[id];
            const v = b64 ? dec(b64) : '';
            ok ? p.res(v) : p.rej(new Error(v));
          };
          function py(fn, arg) {
            return new Promise((res, rej) => {
              const id = 'r' + (++rid);
              pending[id] = {res, rej};
              try { Android.callPy(fn, arg === undefined ? '' : String(arg), id); } catch (e) { delete pending[id]; rej(e); }
            });
          }
          function pyBin(fn, b64, name) {
            return new Promise((res, rej) => {
              const id = 'r' + (++rid);
              pending[id] = {res, rej};
              try { Android.callPyBinary(fn, b64, name, id); } catch (e) { delete pending[id]; rej(e); }
            });
          }

          /* ---------- نوافذ حوار ---------- */
          let modalRes = null;
          function closeModal(val) {
            $('modal').classList.remove('on');
            const r = modalRes; modalRes = null;
            if (r) r(val);
          }
          function showModal(o) {
            return new Promise(res => {
              modalRes = res;
              $('mTitle').textContent = o.title || '';
              $('mBody').textContent = o.msg || '';
              $('mBody').hidden = !o.msg;
              const inp = $('mInput');
              inp.hidden = o.input === undefined;
              if (o.input !== undefined) inp.value = o.input;
              const bx = $('mBtns');
              bx.innerHTML = '';
              bx.className = o.row ? 'row2' : '';
              o.buttons.forEach(b => {
                const el = document.createElement('button');
                el.textContent = b.label;
                if (b.cls) el.className = b.cls;
                el.onclick = () => closeModal(b.val === '__in' ? inp.value : b.val);
                bx.appendChild(el);
              });
              $('modal').classList.add('on');
              if (o.input !== undefined) setTimeout(() => { inp.focus(); inp.select(); }, 60);
            });
          }
          $('mInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') closeModal($('mInput').value);
          });
          const askText = (title, def) => showModal({title, input: def, row: true, buttons: [{label: t('cancel'), val: null}, {label: t('ok'), val: '__in', cls: 'pri'}]});
          const askConfirm = (title, msg) => showModal({title, msg, row: true, buttons: [{label: t('cancel'), val: false}, {label: t('ok'), val: true, cls: 'pri'}]});
          async function sheet(title, actions) {
            const btns = actions.map((a, i) => ({label: a.label, val: i, cls: a.cls}));
            btns.push({label: t('cancel'), val: null});
            const r = await showModal({title, buttons: btns});
            if (r !== null && actions[r]) await actions[r].fn();
          }
          let toastT = null;
          function toast(m) {
            const el = $('toast');
            el.textContent = m; el.classList.add('on');
            clearTimeout(toastT);
            toastT = setTimeout(() => el.classList.remove('on'), 1800);
          }

          /* ---------- المحرر ---------- */
          let ed, docs = {}, order = [], active = null, curDir = '', items = [], expanded = new Set(), autoT = null;
          function modeFor(p) {
            const e = (p.split('.').pop() || '').toLowerCase();
            return {py: 'python', js: 'javascript', json: {name: 'javascript', json: true}, html: 'htmlmixed', htm: 'htmlmixed',
              xml: 'xml', css: 'css', md: 'markdown', sh: 'shell'}[e] || 'text/plain';
          }
          function initEditor() {
            ed = CodeMirror.fromTextArea($('code'), {
              lineNumbers: true, lineWrapping: S.wrap, indentUnit: 4, tabSize: 4, indentWithTabs: false,
              matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true, mode: 'python',
              theme: S.theme === 'dark' ? 'material-darker' : 'default',
              extraKeys: {
                'Tab': cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ', 'end'),
                'Shift-Tab': cm => cm.indentSelection('subtract'),
                'Ctrl-S': () => saveCurrent(true),
                'Ctrl-/': cm => cm.toggleComment(),
                'Ctrl-F': () => toggleFind(true),
                'Ctrl-Enter': () => toggleRun()
              }
            });
            ed.on('change', () => {
              updateDirty();
              if (S.auto && active) { clearTimeout(autoT); autoT = setTimeout(() => saveCurrent(false), 1500); }
            });
            ed.setOption('readOnly', 'nocursor');
          }
          function isDirty(p) { const d = docs[p]; return !!d && !d.doc.isClean(d.gen); }
          function updateDirty() {
            if (!active) return;
            const d = isDirty(active);
            $('dirty').hidden = !d;
            if (docs[active].was !== d) { docs[active].was = d; renderTabs(); }
          }
          async function openFile(path) {
            if (!docs[path]) {
              const c = await py('read_file', path);
              if (c.charAt(0) === '\u0000') { toast(t('binary')); return; }
              const d = new CodeMirror.Doc(c, modeFor(path));
              docs[path] = {doc: d, gen: d.changeGeneration(true), was: false};
              order.push(path);
            }
            switchTo(path);
          }
          function switchTo(path) {
            active = path;
            ed.swapDoc(docs[path].doc);
            ed.setOption('readOnly', false);
            $('empty').hidden = true;
            $('curName').textContent = path;
            const i = path.lastIndexOf('/');
            curDir = i >= 0 ? path.slice(0, i) : '';
            S.last = path; S.open = order.slice(); saveS();
            updateDirty(); renderTabs(); renderTree();
            setTimeout(() => ed.refresh(), 30);
          }
          function showNone() {
            active = null;
            ed.swapDoc(new CodeMirror.Doc(''));
            ed.setOption('readOnly', 'nocursor');
            $('empty').hidden = false;
            $('curName').textContent = 'PyIDE';
            $('dirty').hidden = true;
            S.last = null; S.open = order.slice(); saveS();
            renderTabs(); renderTree();
          }
          async function saveFile(path, quiet) {
            const d = docs[path];
            if (!d) return;
            await py('write_file', JSON.stringify({path: path, content: d.doc.getValue()}));
            d.gen = d.doc.changeGeneration(true);
            d.was = false;
            if (path === active) $('dirty').hidden = true;
            renderTabs();
            if (!quiet) toast(t('saved'));
          }
          async function saveCurrent(show) { if (active) { try { await saveFile(active, !show); } catch (e) { toast(e.message); } } }
          async function saveAll() { for (const p of order) if (isDirty(p)) await saveFile(p, true); }
          async function closeTab(p) {
            if (isDirty(p)) await saveFile(p, true);
            const i = order.indexOf(p);
            order.splice(i, 1);
            delete docs[p];
            if (active === p) {
              if (order.length) switchTo(order[Math.min(i, order.length - 1)]); else showNone();
            } else { S.open = order.slice(); saveS(); renderTabs(); }
          }
          function renderTabs() {
            const box = $('tabs');
            box.innerHTML = '';
            order.forEach(p => {
              const el = document.createElement('div');
              el.className = 'tab' + (p === active ? ' active' : '');
              const nm = document.createElement('span');
              nm.textContent = p.split('/').pop();
              el.appendChild(nm);
              if (isDirty(p)) { const i = document.createElement('i'); i.textContent = ' ●'; el.appendChild(i); }
              const x = document.createElement('b');
              x.textContent = '×';
              x.onclick = ev => { ev.stopPropagation(); closeTab(p); };
              el.appendChild(x);
              el.onclick = () => switchTo(p);
              box.appendChild(el);
              if (p === active) setTimeout(() => el.scrollIntoView({inline: 'nearest', block: 'nearest'}), 0);
            });
            box.hidden = order.length === 0;
          }

          /* ---------- البحث ---------- */
          function toggleFind(force) {
            const fb = $('findbar');
            const show = force === undefined ? fb.hidden : force;
            fb.hidden = !show;
            if (show) { const s = ed.getSelection(); if (s && s.indexOf('\n') < 0) $('fin').value = s; $('fin').focus(); $('fin').select(); }
            setTimeout(() => ed.refresh(), 30);
          }
          function findNext(rev, fromStart) {
            const q = $('fin').value;
            if (!q || !active) return;
            const opt = {caseFold: true};
            let start = rev ? ed.getCursor('from') : (fromStart ? ed.getCursor('from') : ed.getCursor('to'));
            let cur = ed.getSearchCursor(q, start, opt);
            let ok = rev ? cur.findPrevious() : cur.findNext();
            if (!ok) {
              cur = ed.getSearchCursor(q, rev ? CodeMirror.Pos(ed.lastLine()) : CodeMirror.Pos(0, 0), opt);
              ok = rev ? cur.findPrevious() : cur.findNext();
              if (!ok) { if (!fromStart) toast(t('nomatch')); return; }
            }
            ed.setSelection(cur.from(), cur.to());
            ed.scrollIntoView({from: cur.from(), to: cur.to()}, 80);
          }
          function replaceOne() {
            const q = $('fin').value;
            if (!q || !active) return;
            if (ed.getSelection().toLowerCase() === q.toLowerCase()) ed.replaceSelection($('rin').value);
            findNext(false);
          }
          function replaceAll() {
            const q = $('fin').value;
            if (!q || !active) return;
            let n = 0;
            const cur = ed.getSearchCursor(q, CodeMirror.Pos(0, 0), {caseFold: true});
            const rep = $('rin').value;
            ed.operation(() => { while (cur.findNext()) { cur.replace(rep); n++; } });
            toast(n + ' ✓');
          }

          /* ---------- أزرار الأقواس ---------- */
          const KEYS = ['Tab', '(', ')', '[', ']', '{', '}', '"', "'", ':', '=', '_', '#', '.', ',', '/', '\\', '+', '-', '*', '<', '>', '↶', '↷'];
          (function () {
            const box = $('keys');
            KEYS.forEach(k => {
              const b = document.createElement('button');
              b.textContent = k === 'Tab' ? '⇥' : k;
              b.onpointerdown = ev => {
                ev.preventDefault();
                if (!active) return;
                if (k === 'Tab') ed.execCommand('defaultTab');
                else if (k === '↶') ed.undo();
                else if (k === '↷') ed.redo();
                else ed.replaceSelection(k, 'end');
                ed.focus();
              };
              box.appendChild(b);
            });
          })();
          CodeMirror.commands.defaultTab = cm => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    ', 'end');

          /* ---------- الملفات ---------- */
          function toggleDrawer(force) {
            document.body.classList.toggle('drawer-open', force === undefined ? !document.body.classList.contains('drawer-open') : force);
          }
          async function refreshTree() {
            try { items = JSON.parse(await py('list_files')); } catch (e) { items = []; }
            renderTree();
          }
          function buildTree() {
            const root = {children: {}};
            items.forEach(it => {
              const parts = it.path.split('/');
              let n = root;
              parts.forEach((p, i) => {
                if (!n.children[p]) n.children[p] = {name: p, path: parts.slice(0, i + 1).join('/'), isDir: true, children: {}};
                n = n.children[p];
              });
              n.isDir = it.isDir;
            });
            return root;
          }
          function renderTree() {
            const box = $('tree');
            box.innerHTML = '';
            const walk = (node, depth) => {
              Object.values(node.children)
                .sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name))
                .forEach(n => {
                  const row = document.createElement('div');
                  row.className = 'row' + (n.path === active ? ' active' : '') + (n.isDir && n.path === curDir ? ' cur' : '');
                  row.style.paddingLeft = (10 + depth * 14) + 'px';
                  const nm = document.createElement('span');
                  nm.className = 'nm';
                  const open = expanded.has(n.path);
                  nm.textContent = (n.isDir ? (open ? '▾ 📂 ' : '▸ 📁 ') : (n.name.endsWith('.py') ? '🐍 ' : '📄 ')) + n.name;
                  row.appendChild(nm);
                  const mn = document.createElement('button');
                  mn.className = 'mn';
                  mn.textContent = '⋮';
                  mn.onclick = ev => { ev.stopPropagation(); rowMenu(n); };
                  row.appendChild(mn);
                  row.onclick = () => {
                    if (n.isDir) { if (open) expanded.delete(n.path); else expanded.add(n.path); curDir = n.path; renderTree(); }
                    else { openFile(n.path); if (innerWidth < 900) toggleDrawer(false); }
                  };
                  box.appendChild(row);
                  if (n.isDir && open) walk(n, depth + 1);
                });
            };
            walk(buildTree(), 0);
          }
          function join(dir, name) { return dir ? dir + '/' + name : name; }
          async function newNode(isDir) {
            const name = await askText(t(isDir ? 'newFolder' : 'newFile') + (curDir ? ' (' + curDir + ')' : ''), isDir ? 'folder' : 'script.py');
            if (!name || !name.trim()) return;
            const p = join(curDir, name.trim());
            try {
              if (items.some(i => i.path === p)) { toast(t('exists')); return; }
              if (isDir) { await py('make_dir', p); expanded.add(p); }
              else await py('write_file', JSON.stringify({path: p, content: ''}));
              if (curDir) expanded.add(curDir);
              await refreshTree();
              if (!isDir) { await openFile(p); if (innerWidth < 900) toggleDrawer(false); }
            } catch (e) { toast(e.message); }
          }
          function rowMenu(n) {
            const acts = [];
            if (n.isDir) acts.push({label: '📄 ' + t('newHere'), fn: () => { curDir = n.path; return newNode(false); }});
            acts.push({label: '✏️ ' + t('rename'), fn: async () => {
              const nn = await askText(t('rename'), n.name);
              if (!nn || nn === n.name) return;
              const i = n.path.lastIndexOf('/');
              const np = (i >= 0 ? n.path.slice(0, i + 1) : '') + nn.trim();
              const r = await py('rename_item', JSON.stringify({from: n.path, to: np}));
              if (r === 'EXISTS') { toast(t('exists')); return; }
              Object.keys(docs).forEach(k => {
                if (k === n.path || k.startsWith(n.path + '/')) {
                  const nk = np + k.slice(n.path.length);
                  docs[nk] = docs[k]; delete docs[k];
                  order = order.map(x => x === k ? nk : x);
                  if (active === k) active = nk;
                }
              });
              if (active) { $('curName').textContent = active; S.last = active; }
              S.open = order.slice(); saveS();
              renderTabs();
              await refreshTree();
            }});
            if (!n.isDir) acts.push({label: '📤 ' + t('share'), fn: () => Android.shareWorkspaceFile(n.path)});
            acts.push({label: '🗑 ' + t('del'), cls: 'dan', fn: async () => {
              if (!(await askConfirm(t('del'), t('confirmDel') + ' ' + n.path))) return;
              await py('delete_item', n.path);
              for (const k of Object.keys(docs)) {
                if (k === n.path || k.startsWith(n.path + '/')) { delete docs[k]; order = order.filter(x => x !== k); if (active === k) active = null; }
              }
              if (!active) { if (order.length) switchTo(order[0]); else showNone(); }
              S.open = order.slice(); saveS();
              await refreshTree();
            }});
            sheet(n.path, acts);
          }
          $('fileIn').onchange = async function (e) {
            const files = Array.from(e.target.files || []);
            e.target.value = '';
            for (const f of files) {
              const data = await new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = () => res(String(r.result).split(',')[1] || '');
                r.onerror = rej;
                r.readAsDataURL(f);
              });
              const p = join(curDir, f.name);
              try {
                await pyBin('write_binary', data, p);
                if (/\.zip$/i.test(f.name) && await askConfirm(f.name, t('unzip'))) await py('unzip_file', p);
                if (docs[p]) { docs[p].doc.setValue(await py('read_file', p)); docs[p].gen = docs[p].doc.changeGeneration(true); }
              } catch (err) { toast(err.message); }
            }
            toast(t('uploaded'));
            refreshTree();
          };

          /* ---------- التشغيل والطرفية ---------- */
          let running = false, starting = false, startedAt = 0, logOff = 0, termSize = 1;
          const decoder = new TextDecoder();
          function setRunUi(v) {
            const b = $('btnRun');
            b.textContent = v ? '⏹ ' + t('stop') : '▶ ' + t('run');
            b.className = 'run' + (v ? ' stop' : '');
            $('dot').className = v ? 'on' : '';
          }
          function setRunning(v) {
            if (v) starting = false;
            else if (starting && Date.now() - startedAt < 3000) return;
            else starting = false;
            if (v !== running) { running = v; setRunUi(v); }
          }
          async function toggleRun() {
            if (running) { try { await py('stop_server'); toast(t('stopping')); } catch (e) {} return; }
            if (starting) return;
            await saveAll();
            starting = true; startedAt = Date.now();
            setTermSize(Math.max(termSize, 1));
            running = true; setRunUi(true);
            Android.startServer();
          }
          function setTermSize(n) {
            termSize = n;
            document.body.classList.remove('s0', 's1', 's2');
            document.body.classList.add('s' + n);
            $('btnTerm').textContent = n === 2 ? '▼' : '▲';
            setTimeout(() => { ed.refresh(); const o = $('tout'); o.scrollTop = o.scrollHeight; }, 50);
          }
          function cycleTerm() { setTermSize(termSize === 0 ? 1 : termSize === 1 ? 2 : 0); }
          function classify(l) {
            if (/^(Traceback|\s+File "|\w*(Error|Exception)\b.*:|✖)/.test(l)) return 'e';
            if (/^(▶|✔|■|>>>|>)/.test(l)) return 'i';
            return '';
          }
          function appendTerm(text) {
            const tb = $('tout');
            const atBottom = tb.scrollTop + tb.clientHeight >= tb.scrollHeight - 40;
            text.split(/(?<=\n)/).forEach(line => {
              if (!line) return;
              const s = document.createElement('span');
              s.textContent = line;
              const c = classify(line);
              if (c) s.className = c;
              tb.appendChild(s);
            });
            while (tb.childElementCount > 2500) tb.removeChild(tb.firstChild);
            if (atBottom) tb.scrollTop = tb.scrollHeight;
          }
          function pollLog() {
            let r;
            try { r = Android.readLog(String(logOff)); } catch (e) { return; }
            const i = r.indexOf(':');
            const len = parseInt(r.slice(0, i), 10) || 0;
            const b = r.slice(i + 1);
            if (b) {
              const bin = atob(b);
              const bytes = new Uint8Array(bin.length);
              for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
              appendTerm(decoder.decode(bytes, {stream: true}));
            }
            logOff = len;
          }
          async function tick() {
            pollLog();
            try { setRunning((await py('get_status')) === '1'); } catch (e) {}
          }
          function clearTerm() { Android.clearLogs(); logOff = 0; $('tout').innerHTML = ''; }
          function copyLog() { Android.copyText($('tout').innerText); toast(t('copied')); }
          const hist = []; let hi = 0;
          async function submitTerm() {
            const inp = $('tinput');
            const v = inp.value;
            inp.value = '';
            if (running) { try { await py('send_input', v); } catch (e) { appendTerm('✖ ' + e.message + '\n'); } return; }
            if (!v.trim()) return;
            if (v.trim() === 'clear') { clearTerm(); return; }
            hist.push(v); hi = hist.length;
            py('terminal', v).catch(e => appendTerm('✖ ' + e.message + '\n'));
          }
          $('tinput').addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); submitTerm(); }
            else if (e.key === 'ArrowUp' && hist.length) { hi = Math.max(0, hi - 1); e.target.value = hist[hi]; }
            else if (e.key === 'ArrowDown' && hist.length) { hi = Math.min(hist.length, hi + 1); e.target.value = hist[hi] || ''; }
          });

          /* ---------- معاينة localhost ---------- */
          let curUrl = 'http://127.0.0.1:5000';
          async function openPreview() {
            const u = await askText(t('url'), curUrl);
            if (!u) return;
            curUrl = /^https?:\/\//.test(u) ? u : 'http://' + u;
            $('prevUrl').textContent = curUrl;
            $('pframe').src = curUrl;
            $('prev').hidden = false;
          }
          function closePreview() { $('prev').hidden = true; $('pframe').src = 'about:blank'; }

          /* ---------- الإعدادات ---------- */
          async function openSettings() {
            $('selLang').value = S.lang; $('selTheme').value = S.theme; $('rngFs').value = S.fs; $('fsv').textContent = S.fs;
            $('chkWrap').checked = S.wrap; $('chkAuto').checked = S.auto;
            $('settings').hidden = false;
            try { $('mainIn').value = await py('get_main_script'); } catch (e) {}
            loadLibs();
            try { const i = JSON.parse(await py('get_info')); $('about').textContent = 'Python ' + i.python + '\n' + i.workspace; } catch (e) {}
          }
          async function loadLibs() {
            try {
              const l = JSON.parse(await py('list_libs'));
              const box = $('libs');
              box.innerHTML = '';
              if (!l.length) { box.innerHTML = '<span style="color:var(--mut)">' + t('none') + '</span>'; return; }
              l.forEach(n => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = n; box.appendChild(c); });
            } catch (e) {}
          }
          async function saveMain() {
            const v = $('mainIn').value.trim() || 'main.py';
            await py('set_main_script', v);
            toast('main: ' + v);
          }
          function pipInstall() {
            const v = $('pipIn').value.trim();
            if (!v) return;
            $('settings').hidden = true;
            setTermSize(Math.max(termSize, 1));
            py('terminal', 'pip install ' + v).then(() => loadLibs()).catch(e => appendTerm('✖ ' + e.message + '\n'));
            $('pipIn').value = '';
          }
          async function forceRestart() {
            if (await askConfirm(t('restart'), t('restartConfirm'))) Android.restartApp();
          }

          window.onBack = function () {
            if ($('modal').classList.contains('on')) { closeModal(null); return true; }
            if (!$('prev').hidden) { closePreview(); return true; }
            if (!$('settings').hidden) { $('settings').hidden = true; return true; }
            if (!$('findbar').hidden) { toggleFind(false); return true; }
            if (document.body.classList.contains('drawer-open') && innerWidth < 900) { toggleDrawer(false); return true; }
            return false;
          };

          /* ---------- البدء ---------- */
          (async function init() {
            initEditor();
            applyTheme(); applyFont(); applyLang();
            setTermSize(1);
            await refreshTree();
            let main = 'main.py';
            try { main = await py('get_main_script'); $('mainIn').value = main; } catch (e) {}
            const exists = p => items.some(i => !i.isDir && i.path === p);
            for (const p of (S.open || [])) { if (exists(p)) { try { await openFile(p); } catch (e) {} } }
            if (S.last && docs[S.last]) switchTo(S.last);
            else if (!active && exists(main)) await openFile(main);
            setInterval(tick, 700);
          })();
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Build APK
        run: |
          cd /tmp/app
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /tmp/app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
