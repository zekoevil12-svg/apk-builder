name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
        type: string
      package_name:
        required: true
        type: string
      source_type:
        required: true
        type: string
      website_url:
        required: false
        type: string
        default: 'https://example.com'
      source_url:
        required: false
        type: string
        default: ''
      source_ext:
        required: false
        type: string
        default: ''
      icon_url:
        required: false
        type: string
        default: ''
      permissions:
        required: false
        type: string
        default: ''
      server_url:
        required: false
        type: string
        default: ''
      enable_notifications:
        required: false
        type: string
        default: 'no'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          rm cmdline.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "SDK Ready"

      - name: Download source
        if: ${{ inputs.source_url != '' }}
        run: |
          mkdir -p /tmp/src
          curl -L --fail -o "/tmp/src/source.${{ inputs.source_ext }}" "${{ inputs.source_url }}"
          ls -lh /tmp/src/

      - name: Download icon
        if: ${{ inputs.icon_url != '' }}
        run: |
          curl -L --fail -o /tmp/icon.png "${{ inputs.icon_url }}" || true
          ls -lh /tmp/icon.png || true

      - name: Write Python script
        run: |
          cat > /tmp/create.py << 'PYEOF'
          import os, pathlib, shutil, zipfile, base64

          PKG = os.environ["PKG_NAME"]
          APP = os.environ["APP_NAME"]
          SRC = os.environ["SRC_TYPE"]
          EXT = os.environ["SRC_EXT"]
          URL = os.environ["WEBSITE"]
          PERMS = os.environ.get("PERMS", "")
          ANDROID_HOME = os.environ["ANDROID_HOME"]

          PROJECT = pathlib.Path("/tmp/app")
          PKG_PATH = PKG.replace(".", "/")
          (PROJECT / "app/src/main/java" / PKG_PATH).mkdir(parents=True, exist_ok=True)
          (PROJECT / "app/src/main/res/values").mkdir(parents=True, exist_ok=True)
          (PROJECT / "app/src/main/res/mipmap-hdpi").mkdir(parents=True, exist_ok=True)
          (PROJECT / "app/src/main/assets").mkdir(parents=True, exist_ok=True)

          (PROJECT / "settings.gradle").write_text("rootProject.name = \"MyApp\"\ninclude ':app'\n")

          (PROJECT / "build.gradle").write_text(
              "buildscript {\n"
              "    repositories { google(); mavenCentral() }\n"
              "    dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }\n"
              "}\n"
              "allprojects { repositories { google(); mavenCentral() } }\n"
          )

          app_build = """plugins { id 'com.android.application' }
          android {
              namespace '__PKG__'
              compileSdk 34
              defaultConfig {
                  applicationId "__PKG__"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          """.replace("__PKG__", PKG)
          (PROJECT / "app/build.gradle").write_text(app_build)

          (PROJECT / "gradle.properties").write_text(
              "android.useAndroidX=true\n"
              "android.enableJetifier=true\n"
              "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n"
          )

          (PROJECT / "local.properties").write_text("sdk.dir=%s\n" % ANDROID_HOME)

          perms_map = {
              "camera": "android.permission.CAMERA",
              "location": "android.permission.ACCESS_FINE_LOCATION",
              "mic": "android.permission.RECORD_AUDIO",
              "storage": "android.permission.READ_EXTERNAL_STORAGE",
              "notif": "android.permission.POST_NOTIFICATIONS",
              "vibrate": "android.permission.VIBRATE",
              "contacts": "android.permission.READ_CONTACTS",
              "phone": "android.permission.CALL_PHONE",
          }
          perms_xml = ""
          if PERMS:
              for p in PERMS.split(","):
                  p = p.strip()
                  if p in perms_map:
                      perms_xml += '    <uses-permission android:name="%s"/>\n' % perms_map[p]
                      if p == "location":
                          perms_xml += '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
                      if p == "storage":
                          perms_xml += '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n'

          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
          __PERMS__    <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="__APP__"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """.replace("__PERMS__", perms_xml).replace("__APP__", APP)
          (PROJECT / "app/src/main/AndroidManifest.xml").write_text(manifest)

          java_code = '''package __PKG__;

          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  request.grant(request.getResources());
                              }
                          });
                      }
                  });

                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent,
                                                  String contentDisposition, String mimeType,
                                                  long contentLength) {
                          try {
                              DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                              request.setMimeType(mimeType);
                              String cookies = CookieManager.getInstance().getCookie(url);
                              request.addRequestHeader("cookie", cookies);
                              request.addRequestHeader("User-Agent", userAgent);
                              request.setDescription("Downloading");
                              String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              request.setTitle(fileName);
                              request.allowScanningByMediaScanner();
                              request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                              DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                              if (dm != null) {
                                  dm.enqueue(request);
                                  Toast.makeText(getApplicationContext(), "Downloading: " + fileName, Toast.LENGTH_LONG).show();
                              }
                          } catch (Exception e) {
                              Toast.makeText(getApplicationContext(), "Download failed: " + e.getMessage(), Toast.LENGTH_LONG).show();
                          }
                      }
                  });

                  if ("__SRC__".equals("url")) {
                      webView.loadUrl("__URL__");
                  } else {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          '''.replace("__PKG__", PKG).replace("__SRC__", SRC).replace("__URL__", URL)
          (PROJECT / "app/src/main/java" / PKG_PATH / "MainActivity.java").write_text(java_code)

          (PROJECT / "app/src/main/res/values/styles.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"/>\n'
              '</resources>\n'
          )

          src_file = pathlib.Path("/tmp/src/source.%s" % EXT)
          assets = PROJECT / "app/src/main/assets"
          if src_file.exists():
              if EXT == "zip":
                  import tempfile
                  with tempfile.TemporaryDirectory() as tmpdir:
                      with zipfile.ZipFile(src_file, "r") as z:
                          z.extractall(tmpdir)
                      tmp = pathlib.Path(tmpdir)
                      items = list(tmp.iterdir())
                      if len(items) == 1 and items[0].is_dir():
                          src_root = items[0]
                      else:
                          src_root = tmp
                      for item in src_root.iterdir():
                          dest = assets / item.name
                          if item.is_dir():
                              shutil.copytree(item, dest, dirs_exist_ok=True)
                          else:
                              shutil.copy(item, dest)
              else:
                  shutil.copy(src_file, assets / ("index.%s" % EXT))
                  if EXT not in ("html", "htm"):
                      (assets / "index.html").write_text(
                          '<!DOCTYPE html>\n<html>\n<head><meta charset="utf-8"><title>%s</title></head>\n'
                          '<body><div id="app"></div>\n<script src="index.%s"></script>\n</body>\n</html>\n' % (APP, EXT)
                      )

          icon_src = pathlib.Path("/tmp/icon.png")
          if icon_src.exists() and icon_src.stat().st_size > 0:
              for dpi in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  dpi_dir = PROJECT / ("app/src/main/res/%s" % dpi)
                  dpi_dir.mkdir(parents=True, exist_ok=True)
                  shutil.copy(icon_src, dpi_dir / "ic_launcher.png")
          else:
              default_png = base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==")
              (PROJECT / "app/src/main/res/mipmap-hdpi/ic_launcher.png").write_bytes(default_png)

          print("Project created at", PROJECT)
          PYEOF
          echo "Python script written"

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PKG_NAME: ${{ inputs.package_name }}
          SRC_TYPE: ${{ inputs.source_type }}
          SRC_EXT: ${{ inputs.source_ext }}
          WEBSITE: ${{ inputs.website_url }}
          PERMS: ${{ inputs.permissions }}
        run: python3 /tmp/create.py

      - name: Build APK
        run: |
          cd /tmp/app
          gradle assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Find APK
        run: |
          echo "🔍 البحث عن APK..."
          find /tmp/app -name "*.apk" -type f
          echo "📂 محتوى outputs:"
          ls -laR /tmp/app/app/build/outputs/ 2>/dev/null || echo "مفيش مجلد outputs"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /tmp/app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
