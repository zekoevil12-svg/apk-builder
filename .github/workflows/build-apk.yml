name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
      package_name:
        required: true
      source_type:
        required: true
        default: 'url'
      website_url:
        required: false
        default: 'https://example.com'
      has_source_file:
        required: false
        default: 'no'
      source_ext:
        required: false
        default: ''
      has_icon:
        required: false
        default: 'no'
      permissions:
        required: false
        default: ''
      server_url:
        required: false
        default: ''
      enable_notifications:
        required: false
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor
        run: |
          mkdir capacitor-app
          cd capacitor-app
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          if [ "${{ github.event.inputs.enable_notifications }}" = "yes" ]; then
            npm install @capacitor/local-notifications@5
          fi
          mkdir -p www

      - name: Prepare source files
        run: |
          cd capacitor-app
          ST="${{ github.event.inputs.source_type }}"

          if [ "$ST" = "url" ]; then
            URL="${{ github.event.inputs.website_url }}"
            cat > www/index.html << EOF
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>App</title>
          <style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
          iframe{border:none;width:100%;height:100%;display:block}</style></head>
          <body><iframe src="$URL" allowfullscreen allow="geolocation; microphone; camera"></iframe></body>
          </html>
          EOF

          elif [ "$ST" = "html" ]; then
            cp ../source-input.html www/index.html

          elif [ "$ST" = "zip" ]; then
            unzip -O UTF-8 -o ../source-input.zip -d www_extract 2>&1 || \
            unzip -o ../source-input.zip -d www_extract 2>&1

            ENTRY_COUNT=$(ls -1 www_extract | wc -l)
            if [ "$ENTRY_COUNT" = "1" ] && [ -d "www_extract/$(ls -1 www_extract)" ]; then
              INNER=$(ls -1 www_extract)
              mv www_extract/$INNER/* www/ 2>/dev/null || true
              mv www_extract/$INNER/.[!.]* www/ 2>/dev/null || true
            else
              mv www_extract/* www/ 2>/dev/null || true
              mv www_extract/.[!.]* www/ 2>/dev/null || true
            fi
            rm -rf www_extract

            if [ ! -f www/index.html ]; then
              FOUND=$(find www -maxdepth 4 -name "index.html" -o -name "index.htm" | head -1)
              if [ -n "$FOUND" ]; then
                DIR=$(dirname "$FOUND")
                cp -r "$DIR"/* www/ 2>/dev/null || true
              fi
            fi
          fi

          if [ ! -f www/index.html ]; then
            echo "❌ لا يوجد index.html!"; exit 1
          fi

          # حقن سكريبت الإشعارات
          if [ "${{ github.event.inputs.enable_notifications }}" = "yes" ] && \
             [ -n "${{ github.event.inputs.server_url }}" ]; then
            cat >> www/index.html << 'EOF'
          <script>
          (async function(){
            const API = "SERVER_URL_PLACEHOLDER";
            const PKG = "PACKAGE_PLACEHOLDER";
            let lastId = 0;
            async function poll(){
              try {
                const r = await fetch(API + "/api/app/" + PKG + "/messages?since=" + lastId);
                const j = await r.json();
                if (j.ok && j.messages.length) {
                  for (const m of j.messages) {
                    const LN = window.Capacitor && window.Capacitor.Plugins
                              && window.Capacitor.Plugins.LocalNotifications;
                    if (LN) {
                      await LN.schedule({ notifications: [{
                        id: Math.floor(Date.now() % 2147483647),
                        title: m.title, body: m.body
                      }]});
                    } else if (window.Notification && Notification.permission === "granted") {
                      new Notification(m.title, { body: m.body });
                    }
                    lastId = m.id;
                  }
                }
              } catch(e){}
            }
            setTimeout(poll, 5000);
            setInterval(poll, 30000);
          })();
          </script>
          EOF
            sed -i "s|SERVER_URL_PLACEHOLDER|${{ github.event.inputs.server_url }}|g" www/index.html
            sed -i "s|PACKAGE_PLACEHOLDER|${{ github.event.inputs.package_name }}|g" www/index.html
          fi

      - name: Configure Capacitor
        run: |
          cd capacitor-app
          ST="${{ github.event.inputs.source_type }}"
          if [ "$ST" = "url" ]; then
            cat > capacitor.config.json << EOF
          {
            "appId": "${{ github.event.inputs.package_name }}",
            "appName": "${{ github.event.inputs.app_name }}",
            "webDir": "www",
            "server": { "url": "${{ github.event.inputs.website_url }}", "cleartext": true },
            "android": { "allowMixedContent": true }
          }
          EOF
          else
            cat > capacitor.config.json << EOF
          {
            "appId": "${{ github.event.inputs.package_name }}",
            "appName": "${{ github.event.inputs.app_name }}",
            "webDir": "www",
            "android": { "allowMixedContent": true }
          }
          EOF
          fi
          npx cap add android
          npx cap sync android

      - name: Add permissions to AndroidManifest
        if: ${{ github.event.inputs.permissions != '' }}
        run: |
          cd capacitor-app/android/app/src/main
          PERMS="${{ github.event.inputs.permissions }}"
          MANIFEST="AndroidManifest.xml"
          IFS=',' read -ra P <<< "$PERMS"
          for p in "${P[@]}"; do
            case "$p" in
              camera)    AP="android.permission.CAMERA";;
              location)  AP="android.permission.ACCESS_FINE_LOCATION";;
              mic)       AP="android.permission.RECORD_AUDIO";;
              storage)   AP="android.permission.READ_EXTERNAL_STORAGE";;
              notif)     AP="android.permission.POST_NOTIFICATIONS";;
              vibrate)   AP="android.permission.VIBRATE";;
              contacts)  AP="android.permission.READ_CONTACTS";;
              phone)     AP="android.permission.CALL_PHONE";;
              *) continue;;
            esac
            sed -i "/<application/i \    <uses-permission android:name=\"$AP\" />" $MANIFEST
          done
          cat $MANIFEST

      - name: Apply custom icon
        if: ${{ github.event.inputs.has_icon == 'yes' }}
        run: |
          cd capacitor-app
          npm install @capacitor/assets
          mkdir -p resources
          cp ../icon-input.png resources/icon.png || true
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Configure Gradle
        run: |
          cd capacitor-app/android
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK
        run: |
          cd capacitor-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
