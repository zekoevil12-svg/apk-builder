name: Build Advanced Python IDE (Python 3.11)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'اسم الحزمة (مثال: com.my.pyide)'
        required: true
        default: 'com.pyide.app'
      app_name:
        description: 'اسم التطبيق'
        required: true
        default: 'PyIDE Pro'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Set up Python (Build Env)
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip && mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          rm cmdline.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Create Android Project
        env:
          PKG_NAME: ${{ inputs.package_name }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e
          PROJECT=/tmp/app

          # 0. التحقق من اسم الحزمة
          if ! echo "$PKG_NAME" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "Invalid package name: $PKG_NAME (example: com.my.pyide)"; exit 1
          fi
          APP_CLEAN=$(printf '%s' "$APP_NAME" | sed 's/[&<>"'\''\\]//g')
          [ -z "$APP_CLEAN" ] && APP_CLEAN="PyIDE"
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')

          # 1. المجلدات الأساسية
          mkdir -p "$PROJECT/app/src/main/java/$PKG_PATH"
          mkdir -p "$PROJECT/app/src/main/res/values"
          mkdir -p "$PROJECT/app/src/main/res/xml"
          mkdir -p "$PROJECT/app/src/main/res/drawable"
          mkdir -p "$PROJECT/app/src/main/res/mipmap-anydpi"
          mkdir -p "$PROJECT/app/src/main/res/mipmap-anydpi-v26"
          mkdir -p "$PROJECT/app/src/main/assets/lib"
          mkdir -p "$PROJECT/app/src/main/python"

          # 2. إعدادات Gradle
          cat > "$PROJECT/settings.gradle" << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://chaquo.com/maven" }
              }
          }
          rootProject.name = "PyIDEApp"
          include ':app'
          EOF

          cat > "$PROJECT/build.gradle" << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'com.chaquo.python' version '15.0.1' apply false
          }
          EOF

          cat > "$PROJECT/gradle.properties" << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          EOF

          cat > "$PROJECT/app/build.gradle" << 'EOF'
          plugins { id 'com.android.application'; id 'com.chaquo.python' }
          android {
              namespace 'PKG_NAME_PLACEHOLDER'
              compileSdk 34
              defaultConfig {
                  applicationId "PKG_NAME_PLACEHOLDER"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
                  ndk { abiFilters "arm64-v8a", "x86_64" }
                  python {
                      version "3.11"
                      buildPython "python3"
                      pip {
                          install "requests"
                          install "numpy"
                          install "pandas"
                          install "beautifulsoup4"
                          install "lxml"
                          install "flask"
                          install "telethon"
                          install "pycryptodome"
                          install "pillow"
                          install "rich"
                          install "colorama"
                          install "tqdm"
                          install "pip"
                      }
                  }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
          }
          EOF
          sed -i "s/PKG_NAME_PLACEHOLDER/$PKG_NAME/g" "$PROJECT/app/build.gradle"

          # 3. الموارد (اسم التطبيق، الثيم، الأيقونة - بدون تحميل من الإنترنت)
          cat > "$PROJECT/app/src/main/res/values/strings.xml" << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">$APP_CLEAN</string>
          </resources>
          EOF

          cat > "$PROJECT/app/src/main/res/values/colors.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#0D1117</color>
          </resources>
          EOF

          cat > "$PROJECT/app/src/main/res/values/styles.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#0D1117</item>
                  <item name="android:statusBarColor">#161B22</item>
                  <item name="android:navigationBarColor">#0D1117</item>
              </style>
          </resources>
          EOF

          cat > "$PROJECT/app/src/main/res/xml/file_paths.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
          </paths>
          EOF

          cat > "$PROJECT/app/src/main/res/drawable/ic_launcher_fg.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#3776AB" android:pathData="M36,30 H58 A8,8 0 0 1 66,38 V52 H44 A8,8 0 0 0 36,60 Z"/>
              <path android:fillColor="#FFD43B" android:pathData="M72,78 H50 A8,8 0 0 1 42,70 V56 H64 A8,8 0 0 0 72,48 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M50,38m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0"/>
              <path android:fillColor="#3776AB" android:pathData="M58,70m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0"/>
          </vector>
          EOF

          cat > "$PROJECT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF

          cat > "$PROJECT/app/src/main/res/mipmap-anydpi/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/ic_bg"/>
              <item android:drawable="@drawable/ic_launcher_fg"/>
          </layer-list>
          EOF

          # 4. Manifest
          cat > "$PROJECT/app/src/main/AndroidManifest.xml" << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|uiMode|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".PythonService" android:exported="false" android:foregroundServiceType="dataSync"/>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="$PKG_NAME.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF

          # 5. مكتبات المحرر (محلية داخل التطبيق ليعمل بدون إنترنت)
          LIB="$PROJECT/app/src/main/assets/lib"
          CM=https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16
          for f in codemirror.min.js codemirror.min.css theme/material-darker.min.css \
                   mode/python/python.min.js mode/javascript/javascript.min.js mode/xml/xml.min.js \
                   mode/css/css.min.js mode/htmlmixed/htmlmixed.min.js mode/markdown/markdown.min.js \
                   mode/shell/shell.min.js addon/search/searchcursor.min.js addon/edit/closebrackets.min.js \
                   addon/edit/matchbrackets.min.js addon/selection/active-line.min.js addon/comment/comment.min.js; do
            curl -fsSL --retry 3 "$CM/$f" -o "$LIB/$(basename "$f")"
          done

          # 6. كود البايثون (Backend)
          cat > "$PROJECT/app/src/main/python/runner.py" << 'PYEOF'
          import os, sys, json, zipfile, shutil, runpy, traceback, base64, threading, queue, ctypes, subprocess, time, shlex, ast, importlib

          WORK_DIR = ""
          LIBS_DIR = ""
          LOG_FILE = ""
          CFG_FILE = ""
          MAIN_SCRIPT = "main.py"

          _inited = False
          _running = False
          _run_tid = None
          _stdin_q = queue.Queue()
          _repl_ns = {"__name__": "__console__"}

          _SHELL_CMDS = {
              "ls", "pwd", "cat", "echo", "mkdir", "rm", "cp", "mv", "touch", "head", "tail",
              "wc", "grep", "find", "du", "df", "env", "date", "uname", "id", "whoami", "ps",
              "ping", "stat", "chmod", "which", "getprop", "netstat",
          }

          SAMPLE_MAIN = '''# مرحباً بك في PyIDE! 👋
          import sys, platform

          name = input("What's your name? ")
          print(f"Hello {name}!")
          print("Python", sys.version.split()[0], "on", platform.machine())

          try:
              import numpy as np
              print("numpy:", np.arange(6) ** 2)
          except ImportError:
              pass
          '''

          SAMPLE_SERVER = '''# مثال سيرفر Flask - شغّله ثم افتح "معاينة" من الطرفية
          from flask import Flask

          app = Flask(__name__)

          @app.route("/")
          def home():
              return "<h1>Hello from PyIDE 🐍</h1>"

          if __name__ == "__main__":
              app.run(host="127.0.0.1", port=5000)
          '''


          class _QStdin:
              """stdin يقرأ من الطرفية داخل التطبيق (يدعم input())"""
              encoding = "utf-8"

              def readline(self, size=-1):
                  line = _stdin_q.get()
                  return "" if line is None else line

              def read(self, size=-1):
                  return self.readline()

              def isatty(self):
                  return False

              def __iter__(self):
                  return self

              def __next__(self):
                  line = self.readline()
                  if not line:
                      raise StopIteration
                  return line


          def _safe(rel):
              root = os.path.realpath(WORK_DIR)
              p = os.path.realpath(os.path.join(WORK_DIR, rel))
              if p != root and not p.startswith(root + os.sep):
                  raise ValueError("Path outside workspace")
              return p


          def _save_cfg():
              try:
                  with open(CFG_FILE, "w", encoding="utf-8") as f:
                      json.dump({"main": MAIN_SCRIPT}, f)
              except Exception:
                  pass


          def init_env(w_dir, l_file):
              global WORK_DIR, LIBS_DIR, LOG_FILE, CFG_FILE, MAIN_SCRIPT, _inited
              if _inited:
                  return "OK"
              _inited = True
              base = os.path.dirname(w_dir)
              WORK_DIR, LOG_FILE = w_dir, l_file
              LIBS_DIR = os.path.join(base, "pylibs")
              CFG_FILE = os.path.join(base, "ide_config.json")
              os.makedirs(WORK_DIR, exist_ok=True)
              os.makedirs(LIBS_DIR, exist_ok=True)
              os.environ.update({
                  "PYTHONUNBUFFERED": "1",
                  "PYTHONIOENCODING": "utf-8",
                  "HOME": base,
                  "PIP_NO_CACHE_DIR": "1",
                  "PIP_DISABLE_PIP_VERSION_CHECK": "1",
              })
              for p in (LIBS_DIR, WORK_DIR):
                  if p not in sys.path:
                      sys.path.insert(0, p)
              try:
                  with open(CFG_FILE, encoding="utf-8") as f:
                      MAIN_SCRIPT = json.load(f).get("main", "main.py")
              except Exception:
                  pass
              sys.stdout = open(LOG_FILE, "w", encoding="utf-8", buffering=1)
              sys.stderr = sys.stdout
              sys.stdin = _QStdin()
              os.chdir(WORK_DIR)
              if not os.listdir(WORK_DIR):
                  for n, c in (("main.py", SAMPLE_MAIN), ("web_server.py", SAMPLE_SERVER)):
                      with open(os.path.join(WORK_DIR, n), "w", encoding="utf-8") as f:
                          f.write(c)
              print("> PyIDE ready - Python " + sys.version.split()[0])
              return "OK"


          def get_info(_=None):
              return json.dumps({"python": sys.version.split()[0], "workspace": WORK_DIR})


          # ---------------- الملفات ----------------
          def list_files(_=None):
              res = []
              for root, dirs, files in os.walk(WORK_DIR):
                  dirs[:] = sorted(d for d in dirs if d != "__pycache__")
                  for d in dirs:
                      rel = os.path.relpath(os.path.join(root, d), WORK_DIR).replace(os.sep, "/")
                      res.append({"name": d, "path": rel, "isDir": True})
                  for f in sorted(files):
                      rel = os.path.relpath(os.path.join(root, f), WORK_DIR).replace(os.sep, "/")
                      res.append({"name": f, "path": rel, "isDir": False})
              return json.dumps(res)


          def read_file(path):
              p = _safe(path)
              if not os.path.isfile(p):
                  return ""
              with open(p, "rb") as f:
                  data = f.read()
              if b"\0" in data[:4096]:
                  return "\x00BINARY"
              return data.decode("utf-8", errors="replace")


          def write_file(data_json):
              data = json.loads(data_json)
              p = _safe(data["path"])
              d = os.path.dirname(p)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="\n") as f:
                  f.write(data["content"])
              return "OK"


          def write_binary(base64_data, file_name):
              p = _safe(file_name)
              d = os.path.dirname(p)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(p, "wb") as f:
                  f.write(base64.b64decode(base64_data))
              return "OK"


          def delete_item(path):
              p = _safe(path)
              if p == os.path.realpath(WORK_DIR):
                  return "ERR"
              if os.path.isdir(p):
                  shutil.rmtree(p)
              elif os.path.exists(p):
                  os.remove(p)
              return "OK"


          def make_dir(path):
              os.makedirs(_safe(path), exist_ok=True)
              return "OK"


          def rename_item(data_json):
              d = json.loads(data_json)
              src, dst = _safe(d["from"]), _safe(d["to"])
              if os.path.exists(dst):
                  return "EXISTS"
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.move(src, dst)
              return "OK"


          def unzip_file(path):
              p = _safe(path)
              target_dir = os.path.dirname(p)
              with zipfile.ZipFile(p, "r") as z:
                  root = os.path.realpath(WORK_DIR)
                  for m in z.namelist():
                      t = os.path.realpath(os.path.join(target_dir, m))
                      if not t.startswith(root + os.sep) and t != root:
                          raise ValueError("Unsafe zip entry: " + m)
                  z.extractall(target_dir)
              return "OK"


          def set_main_script(name):
              global MAIN_SCRIPT
              MAIN_SCRIPT = name.strip() or "main.py"
              _save_cfg()
              return "OK"


          def get_main_script(_=None):
              return MAIN_SCRIPT


          # ---------------- التشغيل ----------------
          def get_status(_=None):
              return "1" if _running else "0"


          def _cleanup_modules(before):
              root = os.path.realpath(WORK_DIR) + os.sep
              for name in list(sys.modules):
                  if name in before:
                      continue
                  f = getattr(sys.modules.get(name), "__file__", None)
                  try:
                      if f and os.path.realpath(f).startswith(root):
                          sys.modules.pop(name, None)
                  except Exception:
                      pass


          def _execute(target, label):
              global _running, _run_tid
              if _running:
                  print("> Already running")
                  return
              if not os.path.isfile(target):
                  print("✖ " + label + " not found!")
                  return
              _running = True
              _run_tid = threading.get_ident()
              while not _stdin_q.empty():
                  try:
                      _stdin_q.get_nowait()
                  except Exception:
                      break
              before = set(sys.modules)
              importlib.invalidate_caches()
              print("▶ Running " + label + " ...")
              t0 = time.time()
              try:
                  os.chdir(WORK_DIR)
                  sys.argv = [target]
                  runpy.run_path(target, run_name="__main__")
                  print("\n✔ Finished in %.1fs" % (time.time() - t0))
              except SystemExit as e:
                  if e.code in (None, 0):
                      print("\n■ Exited")
                  else:
                      print("\n■ Exited (code %s)" % (e.code,))
              except BaseException:
                  traceback.print_exc()
                  print("\n✖ Script crashed")
              finally:
                  _running = False
                  _run_tid = None
                  _cleanup_modules(before)


          def run_server(_=None):
              try:
                  target = _safe(MAIN_SCRIPT)
              except Exception as e:
                  print("✖ " + str(e))
                  return ""
              _execute(target, MAIN_SCRIPT)
              return ""


          def stop_server(_=None):
              if not _running or _run_tid is None:
                  return "0"
              _stdin_q.put(None)
              r = ctypes.pythonapi.PyThreadState_SetAsyncExc(ctypes.c_ulong(_run_tid), ctypes.py_object(SystemExit))
              return "1" if r == 1 else "0"


          def send_input(text):
              sys.stdout.write(text + "\n")
              _stdin_q.put(text + "\n")
              return "OK"


          # ---------------- الطرفية ----------------
          def exec_python(code):
              try:
                  try:
                      tree = ast.parse(code, mode="eval")
                  except SyntaxError:
                      tree = None
                  if tree is not None:
                      val = eval(compile(tree, "<console>", "eval"), _repl_ns)
                      if val is not None:
                          print(repr(val))
                  else:
                      exec(compile(code, "<console>", "exec"), _repl_ns)
              except BaseException:
                  traceback.print_exc()
              return ""


          def exec_system(cmd):
              try:
                  r = subprocess.run(["/system/bin/sh", "-c", cmd], capture_output=True, text=True,
                                     errors="replace", timeout=120, cwd=os.getcwd())
                  out = (r.stdout or "") + (r.stderr or "")
                  print(out.rstrip("\n") if out.strip() else "(exit %d)" % r.returncode)
              except subprocess.TimeoutExpired:
                  print("✖ timeout (120s)")
              except Exception as e:
                  print("✖ " + str(e))
              return ""


          def _norm(n):
              return n.lower().replace("-", "_").replace(".", "_")


          def _pip_list():
              names = sorted(e[:-10] for e in os.listdir(LIBS_DIR) if e.endswith(".dist-info"))
              print("\n".join(names) if names else "(no extra packages installed)")


          def _pip_uninstall(pkgs):
              for pkg in pkgs:
                  n = _norm(pkg)
                  found = False
                  for e in os.listdir(LIBS_DIR):
                      base = _norm(e.split("-")[0]) if e.endswith(".dist-info") else _norm(e[:-3] if e.endswith(".py") else e)
                      if base == n:
                          p = os.path.join(LIBS_DIR, e)
                          shutil.rmtree(p) if os.path.isdir(p) else os.remove(p)
                          found = True
                  print(("✔ removed " if found else "✖ not found: ") + pkg)


          def pip_cmd(args):
              if not args:
                  print("usage: pip install <pkg> | pip uninstall <pkg> | pip list")
                  return
              if args[0] == "list":
                  return _pip_list()
              if args[0] == "uninstall":
                  return _pip_uninstall([a for a in args[1:] if not a.startswith("-")])
              if args[0] == "install":
                  args = args + ["--target", LIBS_DIR, "--upgrade", "--prefer-binary", "--no-input"]
              try:
                  from pip._internal.cli.main import main as pip_main
              except Exception as e:
                  print("✖ pip not available: " + str(e))
                  return
              try:
                  code = pip_main(args)
                  print("✔ pip done" if code == 0 else "✖ pip failed (code %s) - native packages must be pre-built for Android" % code)
              except SystemExit:
                  pass
              except BaseException:
                  traceback.print_exc()


          def terminal(line):
              s = line.strip()
              print(">>> " + s)
              try:
                  parts = shlex.split(s)
              except ValueError:
                  parts = s.split()
              head = parts[0] if parts else ""
              try:
                  if head in ("pip", "pip3"):
                      pip_cmd(parts[1:])
                  elif parts[:3] in (["python", "-m", "pip"], ["python3", "-m", "pip"]):
                      pip_cmd(parts[3:])
                  elif head in ("python", "python3") and len(parts) > 1 and parts[1].endswith(".py"):
                      _execute(_safe(parts[1]), parts[1])
                  elif head == "cd":
                      os.chdir(_safe(parts[1]) if len(parts) > 1 else WORK_DIR)
                      print(os.getcwd())
                  elif head in _SHELL_CMDS:
                      exec_system(s)
                  else:
                      exec_python(s)
              except BaseException:
                  traceback.print_exc()
              return ""


          def list_libs(_=None):
              return json.dumps(sorted(e[:-10] for e in os.listdir(LIBS_DIR) if e.endswith(".dist-info")))
          PYEOF

          # 7. خدمة الخلفية + النشاط الرئيسي (الجسر)
