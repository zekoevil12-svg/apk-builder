name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
      package_name:
        required: true
      website_url:
        required: true
      has_icon:
        required: false
        default: 'no'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor
        run: |
          mkdir capacitor-app
          cd capacitor-app
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          mkdir -p www
          cat > www/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>App</title>
          <style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;border:none}</style>
          </head>
          <body><iframe src="https://example.com" allowfullscreen></iframe></body></html>
          EOF

      - name: Configure Capacitor
        run: |
          cd capacitor-app
          cat > capacitor.config.json << EOF
          {
            "appId": "${{ github.event.inputs.package_name }}",
            "appName": "${{ github.event.inputs.app_name }}",
            "webDir": "www",
            "server": {
              "url": "${{ github.event.inputs.website_url }}",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Apply custom icon
        if: ${{ github.event.inputs.has_icon == 'yes' }}
        run: |
          cd capacitor-app
          npm install @capacitor/assets
          mkdir -p resources
          cp ../icon-input.png resources/icon.png || true
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Configure Gradle
        run: |
          cd capacitor-app/android
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK
        run: |
          cd capacitor-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
