name: Build Advanced Python IDE (Python 3.11)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'اسم الحزمة (مثال: com.my.pyide)'
        required: true
        default: 'com.pyide.app'

permissions:
  contents: read

env:
  # ==========================================
  # ✏️ عدل من هنا: اسم التطبيق
  APP_NAME: "PyIDE Pro" 
  # ==========================================

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Set up Python (Build Env)
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip && mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          rm cmdline.zip
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Create Android Project
        env:
          PKG_NAME: ${{ inputs.package_name }}
        run: |
          set -e
          PROJECT=/tmp/app
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')

          # 1. إنشاء المجلدات الأساسية (تم إضافة مجلد الأيقونة هنا لحل المشكلة)
          mkdir -p "$PROJECT/app/src/main/java/$PKG_PATH"
          mkdir -p "$PROJECT/app/src/main/res/values"
          mkdir -p "$PROJECT/app/src/main/res/mipmap-hdpi"
          mkdir -p "$PROJECT/app/src/main/assets"
          mkdir -p "$PROJECT/app/src/main/python"

          # 2. تحميل صورة بايثون الافتراضية
          echo "Downloading default Python icon..."
          curl -L --fail -o /tmp/icon.png "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.png" || true

          # 3. إعدادات Gradle
          cat > "$PROJECT/settings.gradle" << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal(); maven { url "https://chaquo.com/maven" } }
          }
          rootProject.name = "PyIDEApp"
          include ':app'
          EOF

          cat > "$PROJECT/build.gradle" << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'com.chaquo.python' version '15.0.1' apply false
          }
          EOF

          cat > "$PROJECT/app/build.gradle" << 'EOF'
          plugins { id 'com.android.application'; id 'com.chaquo.python' }
          android {
              namespace 'PKG_NAME_PLACEHOLDER'
              compileSdk 34
              defaultConfig {
                  applicationId "PKG_NAME_PLACEHOLDER"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters "arm64-v8a", "x86_64" }
                  python {
                      version "3.11"
                      buildPython "python3"
                      pip {
                          install "requests"
                          install "numpy"
                          install "pandas"
                          install "beautifulsoup4"
                          install "lxml"
                          install "flask"
                          install "telethon"
                          install "pycryptodome"
                          install "pillow"
                          install "pip"
                      }
                  }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF
          sed -i "s/PKG_NAME_PLACEHOLDER/$PKG_NAME/g" "$PROJECT/app/build.gradle"

          # 4. كود البايثون الأساسي (Backend)
          cat > "$PROJECT/app/src/main/python/runner.py" << 'PYEOF'
          import os, sys, json, zipfile, shutil, runpy, traceback, io, base64, subprocess

          WORK_DIR = ""
          LOG_FILE = ""
          MAIN_SCRIPT = "main.py"

          def init_env(w_dir, l_file):
              global WORK_DIR, LOG_FILE
              WORK_DIR = w_dir
              LOG_FILE = l_file
              os.makedirs(WORK_DIR, exist_ok=True)
              sys.stdout = open(LOG_FILE, "a", encoding="utf-8", buffering=1)
              sys.stderr = sys.stdout
              print("> System Initialized (Python 3.11 + Pip)")

          def set_main_script(name):
              global MAIN_SCRIPT
              MAIN_SCRIPT = name
              return "OK"

          def get_main_script():
              return MAIN_SCRIPT

          def list_files():
              res = []
              for root, dirs, files in os.walk(WORK_DIR):
                  for d in dirs:
                      p = os.path.relpath(os.path.join(root, d), WORK_DIR)
                      res.append({"name": d, "path": p, "isDir": True})
                  for f in files:
                      p = os.path.relpath(os.path.join(root, f), WORK_DIR)
                      res.append({"name": f, "path": p, "isDir": False})
              return json.dumps(res)

          def read_file(path):
              p = os.path.join(WORK_DIR, path)
              if not os.path.exists(p): return ""
              with open(p, "r", encoding="utf-8", errors="ignore") as f:
                  return f.read()

          def write_file(data_json):
              data = json.loads(data_json)
              p = os.path.join(WORK_DIR, data['path'])
              os.makedirs(os.path.dirname(p), exist_ok=True) if os.path.dirname(p) else None
              with open(p, "w", encoding="utf-8") as f:
                  f.write(data['content'])
              return "OK"

          def write_binary(base64_data, file_name):
              p = os.path.join(WORK_DIR, file_name)
              with open(p, "wb") as f:
                  f.write(base64.b64decode(base64_data))
              return "OK"

          def delete_item(path):
              p = os.path.join(WORK_DIR, path)
              if os.path.isdir(p): shutil.rmtree(p)
              elif os.path.exists(p): os.remove(p)
              return "OK"

          def make_dir(path):
              p = os.path.join(WORK_DIR, path)
              os.makedirs(p, exist_ok=True)
              return "OK"

          def unzip_file(path):
              p = os.path.join(WORK_DIR, path)
              with zipfile.ZipFile(p, 'r') as z:
                  z.extractall(WORK_DIR)
              return "OK"

          def run_server():
              print(f"> Starting {MAIN_SCRIPT}...")
              target = os.path.join(WORK_DIR, MAIN_SCRIPT)
              if not os.path.exists(target):
                  print(f"❌ Error: {MAIN_SCRIPT} not found!")
                  return
              os.chdir(WORK_DIR)
              sys.argv = [target]
              try:
                  runpy.run_path(target, run_name='__main__')
              except Exception:
                  traceback.print_exc()

          def exec_python(code):
              try:
                  local_vars = {}
                  exec(code, globals(), local_vars)
                  return "OK"
              except Exception as e:
                  return f"Error: {e}"

          def exec_system(cmd):
              try:
                  result = subprocess.run(cmd, shell=True, capture_output=True, text=True, cwd=WORK_DIR)
                  output = result.stdout + result.stderr
                  return output if output else "OK"
              except Exception as e:
                  return f"System Error: {e}"

          def install_pip_package(package_name):
              try:
                  import pip
                  old_stdout = sys.stdout
                  sys.stdout = mystdout = io.StringIO()
                  pip.main(['install', package_name])
                  sys.stdout = old_stdout
                  return f"Output:\n{mystdout.getvalue()}"
              except Exception as e:
                  return f"Pip Error: {e}"
          PYEOF

          # 5. خدمات الجافا (Foreground Service + Bridge)
          cat > "$PROJECT/app/src/main/java/$PKG_PATH/PythonService.java" << 'JAVAEOF'
          package __PKG__;
          import android.app.*; import android.content.Intent; import android.os.Build; import android.os.IBinder;
          import androidx.core.app.NotificationCompat; import com.chaquo.python.Python; import com.chaquo.python.android.AndroidPlatform;

          public class PythonService extends Service {
              private static final String CHANNEL_ID = "py_service";
              @Override public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Python IDE", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
              }
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  Notification notif = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("Python IDE is Running").setContentText("Script executing in background")
                          .setSmallIcon(android.R.drawable.ic_media_play).setOngoing(true).build();
                  startForeground(1, notif);
                  new Thread(() -> {
                      try {
                          if (!Python.isStarted()) Python.start(new AndroidPlatform(this));
                          Python.getInstance().getModule("runner").callAttr("run_server");
                      } catch (Exception e) {}
                  }).start();
                  return START_STICKY;
              }
              @Override public IBinder onBind(Intent intent) { return null; }
          }
          JAVAEOF

          cat > "$PROJECT/app/src/main/java/$PKG_PATH/MainActivity.java" << 'JAVAEOF'
          package __PKG__;
          import android.content.Intent; import android.os.Build; import android.os.Bundle;
          import android.webkit.*; import androidx.appcompat.app.AppCompatActivity;
          import com.chaquo.python.PyObject; import com.chaquo.python.Python; import com.chaquo.python.android.AndroidPlatform;
          import java.io.*;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private Python py;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (!Python.isStarted()) Python.start(new AndroidPlatform(this));
                  py = Python.getInstance();
                  
                  String workDir = getFilesDir().getAbsolutePath() + "/workspace";
                  String logFile = getFilesDir().getAbsolutePath() + "/server.log";
                  py.getModule("runner").callAttr("init_env", workDir, logFile);

                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true);
                  
                  webView.addJavascriptInterface(new PythonBridge(), "Android");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class PythonBridge {
                  @JavascriptInterface public void callPy(String func, String args, String reqId) {
                      new Thread(() -> {
                          try {
                              PyObject res = py.getModule("runner").callAttr(func, args);
                              String out = res != null ? res.toString() : "";
                              String safe = out.replace("\\", "\\\\").replace("'", "\\'").replace("\n", "\\n").replace("\r", "");
                              webView.post(() -> webView.evaluateJavascript("window.onPyResult('" + reqId + "', '" + safe + "')", null));
                          } catch (Exception e) {
                              String err = e.getMessage() != null ? e.getMessage().replace("'", "\\'") : "Error";
                              webView.post(() -> webView.evaluateJavascript("window.onPyResult('" + reqId + "', JSON.stringify({error:'" + err + "'}))", null));
                          }
                      }).start();
                  }
                  
                  @JavascriptInterface public void callPyBinary(String func, String base64Data, String fileName, String reqId) {
                      new Thread(() -> {
                          try {
                              PyObject res = py.getModule("runner").callAttr(func, base64Data, fileName);
                              webView.post(() -> webView.evaluateJavascript("window.onPyResult('" + reqId + "', '" + res.toString() + "')", null));
                          } catch (Exception e) {}
                      }).start();
                  }

                  @JavascriptInterface public void startServer() {
                      Intent i = new Intent(MainActivity.this, PythonService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i); else startService(i);
                  }
                  @JavascriptInterface public void stopServer() { stopService(new Intent(MainActivity.this, PythonService.class)); }
                  @JavascriptInterface public String getLogs() {
                      try {
                          File f = new File(getFilesDir(), "server.log");
                          if (!f.exists()) return "";
                          BufferedReader br = new BufferedReader(new FileReader(f));
                          StringBuilder sb = new StringBuilder(); String line;
                          while ((line = br.readLine()) != null) sb.append(line).append("\n");
                          br.close(); return sb.toString();
                      } catch (Exception e) { return ""; }
                  }
                  @JavascriptInterface public void clearLogs() {
                      try { new FileOutputStream(new File(getFilesDir(), "server.log")).close(); } catch (Exception e) {}
                  }
              }
          }
          JAVAEOF

          # 6. ملف الـ Manifest
          cat > "$PROJECT/app/src/main/AndroidManifest.xml" << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="$APP_NAME" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".PythonService" android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

          # 7. واجهة المستخدم (Frontend)
          cat > "$PROJECT/app/src/main/assets/index.html" << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ar" dir="ltr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>PyIDE</title>
            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Fira+Code&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
            <style>
              :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --txt:#c9d1d9; --acc:#58a6ff; --ok:#2ea043; --err:#f85149; }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
              
              header { background: var(--panel); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
              .logo { font-weight: 800; font-size: 18px; color: #fff; display: flex; align-items: center; gap: 8px; }
              .logo span { color: var(--acc); }
              .actions { display: flex; gap: 8px; }
              .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; font-family: inherit; cursor: pointer; font-size: 13px; transition: 0.2s; }
              .btn-run { background: var(--ok); color: #fff; }
              .btn-run:disabled { opacity: 0.5; }
              .btn-stop { background: var(--err); color: #fff; }
              
              .main-layout { flex: 1; display: flex; overflow: hidden; }
              
              .sidebar { width: 220px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
              .side-header { padding: 10px; font-size: 12px; font-weight: 700; color: #8b949e; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
              .side-header button { background: none; border: none; color: var(--acc); font-size: 16px; cursor: pointer; }
              #fileList { flex: 1; overflow-y: auto; padding: 8px; }
              .file-item { padding: 6px 8px; font-family: 'Fira Code', monospace; font-size: 13px; cursor: pointer; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
              .file-item:hover { background: rgba(255,255,255,0.05); }
              .file-item.active { background: rgba(88,166,255,0.1); color: var(--acc); }
              .file-item .del { color: var(--err); font-size: 12px; display: none; }
              .file-item:hover .del { display: block; }
              
              .editor-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
              #editorHost { flex: 1; overflow: hidden; }
              .CodeMirror { height: 100% !important; font-family: 'Fira Code', monospace !important; font-size: 14px; background: var(--bg) !important; }
              .CodeMirror-gutters { background: var(--bg) !important; border-right: 1px solid var(--border) !important; }
              
              .terminal { height: 35%; background: #000; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
              .term-header { background: #161b22; padding: 6px 12px; font-size: 12px; color: #8b949e; display: flex; justify-content: space-between; align-items: center; }
              .term-body { flex: 1; padding: 10px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 12px; color: #3fb950; direction: ltr; text-align: left; white-space: pre-wrap; }
              .term-body .err { color: var(--err); }
              .term-input { width: 100%; background: #000; border: none; border-top: 1px solid var(--border); color: #fff; padding: 8px 10px; font-family: 'Fira Code', monospace; font-size: 12px; outline: none; }
              
              .settings-panel { width: 250px; background: var(--panel); border-left: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 16px; }
              .settings-panel h3 { font-size: 13px; color: #8b949e; margin-bottom: 6px; }
              .settings-panel input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 12px; }
              .settings-panel button { background: var(--acc); color: #000; padding: 8px; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 6px; }
              
              .lib-tag { background: rgba(88,166,255,0.1); color: var(--acc); border: 1px solid rgba(88,166,255,0.3); padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 11px; display: inline-block; margin: 2px; }
              
              .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 999; }
              .modal.on { display: flex; }
              .modal-content { background: var(--panel); padding: 20px; border-radius: 8px; width: 300px; border: 1px solid var(--border); }
              .modal-content input { width: 100%; padding: 10px; margin: 10px 0; background: var(--bg); border: 1px solid var(--border); color: #fff; }
              .modal-content button { width: 100%; padding: 10px; background: var(--ok); border: none; color: #fff; font-weight: bold; cursor: pointer; }
            </style>
          </head>
          <body>
            <header>
              <div class="logo"><span>⬢</span> PyIDE Pro (v3.11)</div>
              <div class="actions">
                <button class="btn btn-run" id="btnRun" onclick="startServer()">▶ RUN</button>
                <button class="btn btn-stop" id="btnStop" onclick="stopServer()" disabled>⏹ STOP</button>
              </div>
            </header>

            <div class="main-layout">
              <div class="sidebar">
                <div class="side-header">
                  <span>EXPLORER</span>
                  <div>
                    <button onclick="createNode(false)">📄+</button>
                    <button onclick="createNode(true)">📁+</button>
                    <button onclick="document.getElementById('fileIn').click()">⬆</button>
                  </div>
                </div>
                <div id="fileList"></div>
              </div>

              <div class="editor-area">
                <div id="editorHost">
                  <textarea id="codeEditor"></textarea>
                </div>
                <div class="terminal">
                  <div class="term-header">
                    <span>TERMINAL (Python 3.11)</span>
                    <span style="cursor:pointer" onclick="clearLogs()">Clear</span>
                  </div>
                  <div class="term-body" id="termOut">> Waiting for commands...</div>
                  <input type="text" class="term-input" id="termInput" placeholder="Type Python code or shell command..." onkeydown="handleTerminal(event)">
                </div>
              </div>

              <div class="settings-panel">
                <div>
                  <h3>Main File (ملف التشغيل)</h3>
                  <input type="text" id="mainFileInput" value="main.py">
                  <button onclick="saveMainFile()">تغيير الملف الرئيسي</button>
                </div>
                <div>
                  <h3>تثبيت مكتبة نقية (Pip)</h3>
                  <input type="text" id="pipInput" placeholder="e.g. colorama">
                  <button onclick="installPip()">Install Pure Package</button>
                </div>
              </div>
            </div>

            <div class="modal" id="promptModal">
              <div class="modal-content">
                <h3 id="promptTitle">Enter Name</h3>
                <input type="text" id="promptInput">
                <button onclick="submitPrompt()">OK</button>
              </div>
            </div>

            <input type="file" id="fileIn" hidden>

            <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
            <script>
              let editor, activeFile = null, pendingCalls = {}, reqId = 0;
              let isRunning = false;

              editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
                mode: 'python', theme: 'material-darker', lineNumbers: true, lineWrapping: true
              });

              function callPython(func, args = "") {
                return new Promise((resolve) => {
                  const id = "req_" + (++reqId);
                  pendingCalls[id] = resolve;
                  window.Android.callPy(func, args, id);
                });
              }

              window.onPyResult = function(id, result) {
                if (pendingCalls[id]) {
                  pendingCalls[id](result);
                  delete pendingCalls[id];
                }
              };

              async function refreshFiles() {
                const res = await callPython("list_files");
                try {
                  const files = JSON.parse(res);
                  const list = document.getElementById('fileList');
                  list.innerHTML = '';
                  files.forEach(f => {
                    const div = document.createElement('div');
                    div.className = `file-item ${activeFile === f.path ? 'active' : ''}`;
                    div.innerHTML = `<span>${f.isDir ? '📁' : '📄'} ${f.name}</span><span class="del" onclick="delNode(event, '${f.path}')">🗑</span>`;
                    if (!f.isDir) div.onclick = () => openFile(f.path);
                    list.appendChild(div);
                  });
                } catch(e) {}
              }

              async function openFile(path) {
                activeFile = path;
                const content = await callPython("read_file", path);
                editor.setValue(content);
                refreshFiles();
              }

              function delNode(e, path) {
                e.stopPropagation();
                if (!confirm(`Delete ${path}?`)) return;
                callPython("delete_item", path).then(() => {
                  if (activeFile === path) { editor.setValue(''); activeFile = null; }
                  refreshFiles();
                });
              }

              let promptMode = null;
              function createNode(isDir) {
                promptMode = isDir ? 'dir' : 'file';
                document.getElementById('promptTitle').textContent = isDir ? 'New Folder Name' : 'New File Name';
                document.getElementById('promptInput').value = isDir ? 'folder' : 'script.py';
                document.getElementById('promptModal').classList.add('on');
              }
              
              function submitPrompt() {
                const val = document.getElementById('promptInput').value.trim();
                document.getElementById('promptModal').classList.remove('on');
                if (!val) return;
                if (promptMode === 'dir') callPython("make_dir", val).then(refreshFiles);
                else callPython("write_file", JSON.stringify({path: val, content: ''})).then(() => { refreshFiles(); openFile(val); });
              }

              document.getElementById('fileIn').onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function() {
                  const b64 = reader.result.split(',')[1];
                  const id = "bin_" + (++reqId);
                  pendingCalls[id] = function(res) {
                    if (file.name.endsWith('.zip')) {
                      callPython("unzip_file", file.name).then(() => {
                        refreshFiles();
                        alert("تم فك الضغط بنجاح!");
                      });
                    } else {
                      refreshFiles();
                    }
                  };
                  window.Android.callPyBinary("write_binary", b64, file.name, id);
                };
                reader.readAsDataURL(file);
              };

              async function startServer() {
                if (isRunning) return;
                isRunning = true;
                document.getElementById('btnRun').disabled = true;
                document.getElementById('btnStop').disabled = false;
                window.Android.startServer();
                startLogPolling();
              }

              function stopServer() {
                isRunning = false;
                document.getElementById('btnRun').disabled = false;
                document.getElementById('btnStop').disabled = true;
                window.Android.stopServer();
              }

              function saveMainFile() {
                const val = document.getElementById('mainFileInput').value.trim();
                callPython("set_main_script", val).then(() => alert("الملف الرئيسي أصبح: " + val));
              }

              function startLogPolling() {
                setInterval(() => {
                  if (!isRunning) return;
                  const logs = window.Android.getLogs();
                  if (logs) {
                    const out = document.getElementById('termOut');
                    out.innerText = logs;
                    out.scrollTop = out.scrollHeight;
                  }
                }, 1000);
              }

              function clearLogs() {
                window.Android.clearLogs();
                document.getElementById('termOut').innerText = "> Logs cleared.";
              }

              async function handleTerminal(e) {
                if (e.key !== 'Enter') return;
                const cmd = e.target.value.trim();
                if (!cmd) return;
                e.target.value = '';

                const out = document.getElementById('termOut');
                out.innerText += `\n$ ${cmd}\n`;

                if (cmd.startsWith('pip install ')) {
                  const pkg = cmd.replace('pip install ', '').trim();
                  const res = await callPython("install_pip_package", pkg);
                  out.innerText += res + '\n';
                } else if (['ls', 'pwd', 'cat', 'echo'].some(c => cmd.startsWith(c))) {
                  const res = await callPython("exec_system", cmd);
                  out.innerText += res + '\n';
                } else {
                  const res = await callPython("exec_python", cmd);
                  if (res !== "OK") out.innerText += res + '\n';
                }
                out.scrollTop = out.scrollHeight;
              }

              refreshFiles();
              callPython("get_main_script").then(res => {
                if(res) document.getElementById('mainFileInput').value = res;
              });
            </script>
          </body>
          </html>
          HTMLEOF

          # 8. وضع الأيقونة في مكانها
          if [ -f /tmp/icon.png ]; then cp /tmp/icon.png "$PROJECT/app/src/main/res/mipmap-hdpi/ic_launcher.png"; fi

      - name: Build APK
        run: |
          cd /tmp/app
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /tmp/app/**/build/outputs/apk/debug/*.apk
